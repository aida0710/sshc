# タグからリリース成果物をビルドして公開する。
# OS 固有の成果物は対象 OS の runner でビルドし、各ジョブ内で検証する。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # Linux jobがfull suiteを一度実行する。ここでは配布対象OSに固有のPTY、path、
      # user解決を再実行し、同じWeb/deadcode/race検査を3runnerで重複させない。
      - name: Verify macOS behaviour
        run: go test -v -count=1 ./...

      - name: Build the CLI for this OS
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-cli-current
      # ファイル名の検査ではアーキテクチャを保証できないため、成果物を実行する。
      - name: Smoke the built CLI
        run: scripts/ci/cli-smoke.sh dist "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos
          path: dist/sshc-darwin-*
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # tagがmain以外を指しても未検証の成果物を公開しないよう、full suiteは
      # Linuxで一度実行する。macOSとWindowsはOS固有のGo testだけを受け持つ。
      - name: Verify the full source tree
        run: make test

      - name: Build the CLI for this OS
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-cli-current
      # ファイル名の検査ではアーキテクチャを保証できないため、成果物を実行する。
      - name: Smoke the built CLI
        run: scripts/ci/cli-smoke.sh dist "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-linux
          path: dist/sshc-linux-*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # Makefile の recipe は POSIX シェルを前提とするため、Windows では
      # nativebuild を直接実行する。成果物一覧との一致は契約テストで検証する。
      # Windows runner には race detector に必要な C ツールチェーンがないため、
      # このジョブでは -race を実行しない。PowerShell では native command の
      # 非ゼロ終了を確実に検出するよう、次の2変数を設定する。
      - name: Verify Windows behaviour
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go build ./...
          go test -v -count=1 ./...

      - name: Build the CLI for this OS
        env:
          SSHC_NATIVE_VERSION: ${{ github.ref_name }}
        run: go run ./internal/nativebuild/cmd/nativebuild release-current --arches "amd64 arm64" --output-dir dist
      # Windows 用成果物を実行して、アーキテクチャとバージョンを検証する。
      - name: Smoke the built CLI
        run: ./scripts/ci/cli-smoke.ps1 -DistDir dist -ExpectedVersion "${{ github.ref_name }}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows
          path: dist/sshc-windows-*
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 配布用の署名鍵がなければ停止する。debug 鍵へのフォールバックは行わない。
      - name: Require a signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "This release has no Android signing key." >&2
            echo "Create these repository secrets, then re-run:" >&2
            echo "  ANDROID_KEYSTORE_BASE64   base64 of a JKS/PKCS12 keystore" >&2
            echo "  ANDROID_KEYSTORE_PASSWORD" >&2
            echo "  ANDROID_KEY_ALIAS" >&2
            echo "  ANDROID_KEY_PASSWORD" >&2
            echo "Keep the same key forever: Android refuses an update signed by another." >&2
            exit 1
          }

      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: gomobile bind
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME" || {
            echo "runner image did not provide an NDK" >&2
            exit 1
          }
          # APK と組み込み engine に同じバージョンを設定する。
          make android-bind ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            ANDROID_VERSION="${GITHUB_REF_NAME#v}"

      # 署名鍵は runner の一時ディレクトリに置き、成果物へ混入させない。
      - name: assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          ANDROID_KEYSTORE_PATH="$keystore" \
            ./gradlew --no-daemon assembleRelease \
              -PsshcVersionName="${GITHUB_REF_NAME#v}"
          rm -f "$keystore"

      # Gradle の終了状態だけでなく、apksigner で成果物の署名を検証する。
      - name: The APK is signed
        run: |
          set -eu
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" verify --print-certs "$apk"
          cp "$apk" "sshc-android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-android
          path: sshc-android-*.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [macos, linux, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # version-controlled なリリース本文を取得するため checkout する。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: incoming

      # 各ジョブの sshc-* 成果物を公開用ディレクトリへ集約する。
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find incoming -type f -name 'sshc-*' -exec cp {} dist/ \;
          ls -la dist

      # 手動ダウンロード用の SHA-256 チェックサムを生成する。
      - name: Package
        run: cd dist && sha256sum sshc-* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes_file" ]; then
            echo "release notes file is missing: $notes_file" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file" \
            dist/sshc-* dist/checksums.txt

  # packaging/homebrew/sshc.rb を基に、公開したタグとチェックサムで tap を更新する。
  # tap 専用の deploy key が未設定の場合は、このジョブを正常終了する。
  homebrew:
    name: Homebrew tap
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Update the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          TAP_REPO: aida0710/homebrew-tap
        run: |
          set -eu
          if [ -z "${TAP_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; leaving the tap alone." >&2
            exit 0
          fi

          # Formula はタグのソース tarball とその SHA-256 を参照する。
          tarball="https://github.com/$SOURCE_REPO/archive/refs/tags/$RELEASE_TAG.tar.gz"
          curl -fsSL "$tarball" -o source.tar.gz
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          version=${RELEASE_TAG#v}

          sed -e "s#^  url .*#  url \"$tarball\"#" \
              -e "s#^  sha256 .*#  sha256 \"$sum\"#" \
              packaging/homebrew/sshc.rb > sshc.rb

          # sed は置換対象がなくても成功するため、結果を明示的に検証する。
          grep -q "$sum" sshc.rb || { echo "the checksum was not written into the formula" >&2; exit 1; }
          grep -q "$RELEASE_TAG" sshc.rb || { echo "the tag was not written into the formula" >&2; exit 1; }

          # deploy key を runner 内の SSH 設定へ一時的に保存する。
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:$TAP_REPO.git" tap
          mkdir -p tap/Formula
          cp sshc.rb tap/Formula/sshc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 新規ファイルも比較対象に含めるため、add 後の staged diff を確認する。
          git add Formula/sshc.rb
          if git diff --cached --quiet; then
            echo "the tap already describes $RELEASE_TAG."
            exit 0
          fi
          git commit -m "sshc $version"
          git push
