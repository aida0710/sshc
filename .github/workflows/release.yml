# タグからリリース成果物をビルドして公開する。
# OS 固有の成果物は対象 OS の runner でビルドし、各ジョブ内で検証する。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "再実行する既存のrelease tag"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Homebrew tap、GitHub Releaseのlatest印、draftを全versionで一列に更新する。
# 古いrunをcancelするとtapだけ更新した状態を作り得るため、必ず最後まで待たせる。
concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.policy.outputs.release_sha }}
      release-channel: ${{ steps.policy.outputs.release_channel }}
      promote-latest: ${{ steps.policy.outputs.promote_latest }}
      latest-stable: ${{ steps.policy.outputs.latest_stable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require protected main ancestry and successful CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          export RELEASE_SHA
          scripts/ci/verify-release-source.sh

      # 手動復旧ではcheckout先に旧版のscriptが含まれ得るため、公開channelと単調性は
      # 現在のworkflow自身に置く。GitHubのlatest印ではなく公開済みstable tagの最大値を見る。
      - name: Select a monotonic publication policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          RELEASE_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          releases=$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$RELEASE_REPOSITORY/releases?per_page=100" | jq -s '[.[][]]')
          same=$(printf '%s' "$releases" | jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]')
          same_count=$(printf '%s' "$same" | jq 'length')
          [ "$same_count" -le 1 ] || { echo "multiple releases exist for $RELEASE_TAG" >&2; exit 1; }
          if printf '%s' "$same" | jq -e 'any(.[]; .draft == false)' >/dev/null; then
            echo "a published release already exists for $RELEASE_TAG" >&2
            exit 1
          fi

          case "$RELEASE_TAG" in
            *-*|*+*) release_channel=prerelease ;;
            *) release_channel=stable ;;
          esac
          promote_latest=false
          latest_stable=$(printf '%s' "$releases" | jq -r '
            .[] |
            select(.draft == false and .prerelease == false) |
            .tag_name |
            select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
          ' | sort -V | tail -1)
          if [ "$release_channel" = stable ]; then
            if [ -z "$latest_stable" ]; then
              promote_latest=true
            else
              newest=$(printf '%s\n%s\n' "$latest_stable" "$RELEASE_TAG" | sort -V | tail -1)
              if [ "$newest" = "$RELEASE_TAG" ] && [ "$latest_stable" != "$RELEASE_TAG" ]; then
                promote_latest=true
              elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
                echo "automatic release $RELEASE_TAG would not advance published stable $latest_stable" >&2
                exit 1
              fi
            fi
          fi

          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_channel=%s\n' "$release_channel" >> "$GITHUB_OUTPUT"
          printf 'promote_latest=%s\n' "$promote_latest" >> "$GITHUB_OUTPUT"
          printf 'latest_stable=%s\n' "$latest_stable" >> "$GITHUB_OUTPUT"
          echo "publication policy: channel=$release_channel promote_latest=$promote_latest latest_stable=${latest_stable:-none}"

  macos:
    name: macOS
    needs: [verify-source]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # Linux jobがfull suiteを一度実行する。ここでは配布対象OSに固有のPTY、path、
      # user解決を再実行し、同じWeb/deadcode/race検査を3runnerで重複させない。
      - name: Verify macOS behaviour
        run: go test -v -count=1 ./...

      - name: Build the CLI for this OS
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: make release-cli-current
      # ファイル名の検査ではアーキテクチャを保証できないため、成果物を実行する。
      - name: Smoke the built CLI
        run: scripts/ci/cli-smoke.sh dist "$RELEASE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: dist/sshc-darwin-*
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux
    needs: [verify-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # tagがmain以外を指しても未検証の成果物を公開しないよう、full suiteは
      # Linuxで一度実行する。macOSとWindowsはOS固有のGo testだけを受け持つ。
      - name: Verify the full source tree
        run: make test

      - name: Build the CLI for this OS
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: make release-cli-current
      # ファイル名の検査ではアーキテクチャを保証できないため、成果物を実行する。
      - name: Smoke the built CLI
        run: scripts/ci/cli-smoke.sh dist "$RELEASE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: dist/sshc-linux-*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows
    needs: [verify-source]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # Makefile の recipe は POSIX シェルを前提とするため、Windows では
      # nativebuild を直接実行する。成果物一覧との一致は契約テストで検証する。
      # Windows runner には race detector に必要な C ツールチェーンがないため、
      # このジョブでは -race を実行しない。PowerShell では native command の
      # 非ゼロ終了を確実に検出するよう、次の2変数を設定する。
      - name: Verify Windows behaviour
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go build ./...
          go test -v -count=1 ./...

      - name: Build the CLI for this OS
        env:
          SSHC_NATIVE_VERSION: ${{ env.RELEASE_TAG }}
        run: go run ./internal/nativebuild/cmd/nativebuild release-current --arches "amd64 arm64" --output-dir dist
      # Windows 用成果物を実行して、アーキテクチャとバージョンを検証する。
      - name: Smoke the built CLI
        run: ./scripts/ci/cli-smoke.ps1 -DistDir dist -ExpectedVersion "$env:RELEASE_TAG"

      # 公開するinstall.ps1そのものに、実際の成果物の選択、checksum検証、
      # 安全な置換を通させる。テスト中はPATHを変更しない。
      - name: Smoke the Windows installer
        shell: powershell
        run: ./scripts/ci/install-windows-smoke.ps1 -DistDir dist -ExpectedVersion "$env:RELEASE_TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: dist/sshc-windows-*
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android
    needs: [verify-source]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 配布用の署名鍵がなければ停止する。debug 鍵へのフォールバックは行わない。
      - name: Require a signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "This release has no Android signing key." >&2
            echo "Create these repository secrets, then re-run:" >&2
            echo "  ANDROID_KEYSTORE_BASE64   base64 of a JKS/PKCS12 keystore" >&2
            echo "  ANDROID_KEYSTORE_PASSWORD" >&2
            echo "  ANDROID_KEY_ALIAS" >&2
            echo "  ANDROID_KEY_PASSWORD" >&2
            echo "Keep the same key forever: Android refuses an update signed by another." >&2
            exit 1
          }

      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: Prepare the pinned Android NDK
        id: android-ndk
        run: scripts/ci/prepare-android-ndk.sh

      - name: gomobile bind
        env:
          SSHC_ANDROID_NDK_HOME: ${{ steps.android-ndk.outputs.path }}
        run: |
          # APK と組み込み engine に同じバージョンを設定する。
          make android-bind ANDROID_NDK_HOME="$SSHC_ANDROID_NDK_HOME" \
            ANDROID_VERSION="${RELEASE_TAG#v}"

      # 署名鍵は runner の一時ディレクトリに置き、成果物へ混入させない。
      - name: assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          ANDROID_KEYSTORE_PATH="$keystore" \
            ./gradlew --no-daemon assembleRelease \
              -PsshcVersionName="${RELEASE_TAG#v}"
          rm -f "$keystore"

      # Gradle の終了状態だけでなく、apksigner で成果物の署名を検証する。
      - name: The APK is signed
        run: |
          set -eu
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          verification=$("$signer" verify --print-certs "$apk")
          printf '%s\n' "$verification"
          expected=$(tr -d '[:space:]' < .github/android-release-signer.sha256 | tr '[:lower:]' '[:upper:]')
          actual=$(printf '%s\n' "$verification" |
            sed -n -E 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([0-9a-fA-F]+)$/\2/p' |
            tr '[:lower:]' '[:upper:]' | sort -u)
          count=$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l | tr -d ' ')
          case "$expected" in
            ''|*[!0-9A-F]*) echo "the committed Android signer fingerprint is invalid" >&2; exit 1 ;;
          esac
          [ "${#expected}" -eq 64 ] || { echo "the committed Android signer fingerprint must be SHA-256" >&2; exit 1; }
          [ "$count" -eq 1 ] || { echo "the APK must have exactly one signer" >&2; exit 1; }
          [ "$actual" = "$expected" ] || { echo "the APK was signed by an unexpected certificate" >&2; exit 1; }
          cp "$apk" "sshc-android-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-android
          path: sshc-android-*.apk
          if-no-files-found: error
          retention-days: 1

  stage-release:
    name: Stage release
    # tapを書き換える前に、attestation付きの完全なdraftを作る。tap成功後に残る
    # 可変処理をdraft公開の一回だけへ縮め、失敗時は同じtagの手動復旧で再構築する。
    needs: [macos, linux, windows, android, verify-source]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    outputs:
      release-id: ${{ steps.stage.outputs.release_id }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # version-controlled なリリース本文を取得するため checkout する。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: incoming

      # 公開契約の7成果物を各1件だけ受理する。広いglobで同名を上書きすると、
      # job側の重複や欠落を隠したまま部分的なReleaseを作れてしまう。
      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          expected_assets="
          sshc-darwin-amd64
          sshc-darwin-arm64
          sshc-linux-amd64
          sshc-linux-arm64
          sshc-windows-amd64.exe
          sshc-windows-arm64.exe
          sshc-android-${RELEASE_TAG}.apk
          "
          for name in $expected_assets; do
            matches=$(find incoming -type f -name "$name" -print)
            count=$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')
            [ "$count" -eq 1 ] || {
              echo "expected exactly one release artifact named $name, found $count" >&2
              exit 1
            }
            cp "$matches" "dist/$name"
          done
          count=$(find incoming -type f -name 'sshc-*' | wc -l | tr -d ' ')
          [ "$count" -eq 7 ] || {
            echo "expected exactly 7 release artifacts, found $count" >&2
            exit 1
          }
          cp install.ps1 dist/install.ps1
          ls -la dist

      # 手動ダウンロード用の SHA-256 チェックサムを生成する。
      - name: Package
        run: cd dist && sha256sum sshc-* install.ps1 > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sshc-*
            dist/install.ps1
            dist/checksums.txt

      # Immutable Releasesでは公開後にassetを追加できない。先にdraftへ全assetを置き、
      # APIで公開契約を満たすことを確認してから一度だけpublishする。
      - name: Stage a complete draft
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.verify-source.outputs.release-channel }}
          PROMOTE_LATEST: ${{ needs.verify-source.outputs.promote-latest }}
        run: |
          set -eu
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes_file" ]; then
            echo "release notes file is missing: $notes_file" >&2
            exit 1
          fi
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$PROMOTE_LATEST" = true ]; then
            for installer_doc in README.md docs/release-install.md install.sh; do
              grep -F "SSHC_VERSION=$RELEASE_TAG" "$installer_doc" >/dev/null || {
                echo "$installer_doc does not pin the promoted installer to $RELEASE_TAG" >&2
                exit 1
              }
              grep -F "/sshc/$RELEASE_TAG/install.sh" "$installer_doc" >/dev/null || {
                echo "$installer_doc does not fetch the promoted installer from $RELEASE_TAG" >&2
                exit 1
              }
            done
          fi
          # 直前のrunがasset upload中に停止しても、公開済みreleaseには触れず、
          # 同じtagの未公開draftだけを捨てて再構築できるようにする。
          matching_releases() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
              jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]'
          }
          matches=$(matching_releases)
          count=$(printf '%s' "$matches" | jq 'length')
          [ "$count" -le 1 ] || {
            echo "multiple releases exist for $RELEASE_TAG" >&2
            exit 1
          }
          if [ "$count" -eq 1 ]; then
            printf '%s' "$matches" | jq -e '.[0].draft == true' >/dev/null || {
              echo "a published release already exists for $RELEASE_TAG" >&2
              exit 1
            }
            draft_id=$(printf '%s' "$matches" | jq -er '.[0].id')
            gh api --method DELETE "repos/$GH_REPO/releases/$draft_id"
          fi
          prerelease_args=
          expected_prerelease=false
          if [ "$RELEASE_CHANNEL" = prerelease ]; then
            prerelease_args=--prerelease
            expected_prerelease=true
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            $prerelease_args \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file" \
            dist/sshc-* dist/install.ps1 dist/checksums.txt
          matches=$(matching_releases)
          [ "$(printf '%s' "$matches" | jq 'length')" -eq 1 ] || {
            echo "the release draft for $RELEASE_TAG is not unique" >&2
            exit 1
          }
          release=$(printf '%s' "$matches" | jq '.[0]')
          printf '%s' "$release" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected_prerelease "$expected_prerelease" '
            .draft == true and
            .prerelease == $expected_prerelease and
            ([.assets[].name] | sort) == ([
              "checksums.txt",
              "install.ps1",
              ("sshc-android-" + $tag + ".apk"),
              "sshc-darwin-amd64",
              "sshc-darwin-arm64",
              "sshc-linux-amd64",
              "sshc-linux-arm64",
              "sshc-windows-amd64.exe",
              "sshc-windows-arm64.exe"
            ] | sort) and
            all(.assets[]; .size > 0)
          ' >/dev/null
          release_id=$(printf '%s' "$release" | jq -er '.id')
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

  # packaging/homebrew/sshc.rb を基に、検証済みタグとチェックサムで tap を更新する。
  # tap もリリース成果物の一部なので、専用 deploy key が無ければ失敗として扱う。
  homebrew:
    name: Homebrew tap
    # 全成果物の build/smoke が済んでから tap を更新する。ただし GitHub Release の
    # 公開より前に gate し、tap の失敗で公開済み Release が取り残されないようにする。
    needs: [stage-release, verify-source]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify-source.outputs.release-sha }}

      - name: Update the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SOURCE_REPO: ${{ github.repository }}
          TAP_REPO: aida0710/homebrew-tap
          RELEASE_CHANNEL: ${{ needs.verify-source.outputs.release-channel }}
        run: |
          set -eu
          if [ "$RELEASE_CHANNEL" != stable ]; then
            echo "$RELEASE_TAG is not a stable release; leaving the stable Homebrew tap unchanged."
            exit 0
          fi
          if [ -z "${TAP_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; the release cannot update its required tap." >&2
            exit 1
          fi

          # Formula はタグのソース tarball とその SHA-256 を参照する。
          tarball="https://github.com/$SOURCE_REPO/archive/refs/tags/$RELEASE_TAG.tar.gz"
          curl -fsSL "$tarball" -o source.tar.gz
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          version=${RELEASE_TAG#v}

          sed -e "s#^  url .*#  url \"$tarball\"#" \
              -e "s#^  sha256 .*#  sha256 \"$sum\"#" \
              packaging/homebrew/sshc.rb > sshc.rb

          # sed は置換対象がなくても成功するため、結果を明示的に検証する。
          grep -q "$sum" sshc.rb || { echo "the checksum was not written into the formula" >&2; exit 1; }
          grep -q "$RELEASE_TAG" sshc.rb || { echo "the tag was not written into the formula" >&2; exit 1; }

          # deploy key を runner 内の SSH 設定へ一時的に保存する。
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          install -m 600 .github/github.com.known_hosts ~/.ssh/known_hosts
          ssh-keygen -F github.com -f ~/.ssh/known_hosts >/dev/null || {
            echo "the committed GitHub SSH host keys are missing" >&2
            exit 1
          }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:$TAP_REPO.git" tap

          # 手動復旧で古いtagを指定してもstable tapを巻き戻さない。全release runを
          # concurrencyで直列化したうえで、push直前のtapをもう一度正本として比較する。
          current_tag=$(sed -n -E 's#.*archive/refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz.*#\1#p' tap/Formula/sshc.rb | head -1)
          if [ -n "$current_tag" ]; then
            newest=$(printf '%s\n%s\n' "$current_tag" "$RELEASE_TAG" | sort -V | tail -1)
            if [ "$newest" != "$RELEASE_TAG" ]; then
              echo "the tap already has newer stable $current_tag; recovery will not downgrade it to $RELEASE_TAG"
              exit 0
            fi
          fi
          mkdir -p tap/Formula
          cp sshc.rb tap/Formula/sshc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 新規ファイルも比較対象に含めるため、add 後の staged diff を確認する。
          git add Formula/sshc.rb
          if git diff --cached --quiet; then
            echo "the tap already describes $RELEASE_TAG."
            exit 0
          fi
          git commit -m "sshc $version"
          git push

  publish:
    name: Publish
    # 完全なdraftとtap更新が成功した後は、一回のAPI更新だけで公開状態へ移す。
    needs: [stage-release, homebrew, verify-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the staged release without moving stable backwards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release-id }}
          RELEASE_CHANNEL: ${{ needs.verify-source.outputs.release-channel }}
          PROMOTE_LATEST: ${{ needs.verify-source.outputs.promote-latest }}
        run: |
          set -eu
          [ -n "$RELEASE_ID" ] || { echo "the staged release id is missing" >&2; exit 1; }
          make_latest=false
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$PROMOTE_LATEST" = true ]; then
            make_latest=true
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$make_latest" >/dev/null
          published=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          printf '%s' "$published" | jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected_prerelease "$([ "$RELEASE_CHANNEL" = prerelease ] && echo true || echo false)" '
              .tag_name == $tag and
              .draft == false and
              .prerelease == $expected_prerelease
            ' >/dev/null
