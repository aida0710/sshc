name: Release

# トリガーはタグだけである。ここにあるものはブランチへの push では走らない。
# リリースは意図的な行為であり、バイナリが報告するバージョンは、それがビルド
# された元のタグそのものだからだ。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # 他のあらゆる push と同じゲートである。これを通れないタグは、誰にも
      # インストールできてはならないタグだ。
      - name: Verify
        run: make test

      # 4 つの成果物を 1 台のランナーで作る。このプロジェクトは cgo を 1 行も
      # 使っていないので、Linux はクロスコンパイルで足りる。darwin だけは cgo を
      # 有効にしたままにする理由が Makefile に書いてある。
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-binaries

      # デスクトップの外殻を 4 つ作る。**1 台の macOS から macOS と Linux の
      # 両方が出る**——それが Tauri ではなく Electron を選んだ理由であり、
      # 手元で確かめてある。束ごとに入る sshc は、その束のプラットフォームの
      # ものである（Makefile がそう並べる）。
      #
      # 署名はまだ無い。macOS では初回に右クリック→開くが要る。
      - name: Build the desktop shell
        env:
          VERSION: ${{ github.ref_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: make desktop-dist

      - name: Collect the desktop bundles
        run: cp desktop/dist/*.dmg desktop/dist/*.AppImage dist/

      # チェックサムは、手でダウンロードしたものを検証する人のためにある。
      # それが記述する対象の隣に公開されるので、転送の途中切断は捕まえられるが、
      # このリリースが正直かどうかについては何も言わない — README がどちらで
      # あるかを述べており、そうでないかのようにほのめかしてはいない。
      - name: Package
        run: cd dist && shasum -a 256 sshc-* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/sshc-* dist/checksums.txt
