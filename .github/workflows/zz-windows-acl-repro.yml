# 一時の workflow。Windows の ACL の競合を確かめたら消す。
name: Windows ACL repro

on:
  push:
    branches: [fix/windows-background-upload-acl]

permissions:
  contents: read

jobs:
  repro:
    name: Windows ACL repro
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Storage first-write race
        if: ${{ !cancelled() }}
        run: go test ./internal/storage -run TestTwoWritersCreatingTheSameDirectoryBothWritePrivateFiles -count=3 -v 2>&1 | Select-String -Pattern "FAIL|DEBUG|PASS|ok " | Select-Object -First 20
      - name: Background upload test repeated
        if: ${{ !cancelled() }}
        run: go test ./internal/application -run TestABackgroundAddedWhileAnotherIsUploadingDoesNotGetOverwritten -count=1500 -failfast=false -v 2>&1 | Select-String -Pattern "FAIL|DEBUG|background_upload_test" | Select-Object -First 40
