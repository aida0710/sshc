# すべての push と pull request に対する検証ワークフロー。
# ジョブは失敗した検査を識別できる単位に分割する。検査内容はローカルの
# `make test`、`make verify-generated` と一致させる。時間のかかる E2E は
# `make e2e` でローカル実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへの新しい push では実行中の古いジョブを取り消す。
# `main` は全コミットの検証結果を保持するため対象外とする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            race: true
          - os: macos-15
            name: macOS
            race: true
          - os: windows-2025
            name: Windows
            race: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Windows に Unix shell fragment を解釈させない。formatter も OS ごとの
      # script を使い、違反時は対象 path だけを報告する。
      - name: gofmt (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: scripts/ci/check-gofmt.sh

      - name: gofmt (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/ci/check-gofmt.ps1

      # 利用者が実行するWindows PowerShell 5.1自身でinstallerを構文解析する。
      # pwsh 7だけでは5.1固有の非互換を見落とすため、shellも明示する。
      - name: Windows PowerShell installer syntax
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $errors = @()
          foreach ($path in @('install.ps1', 'scripts/ci/install-windows-smoke.ps1')) {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$fileErrors
            ) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: go vet (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go vet ./...

      - name: go vet (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go vet ./...

      - name: go build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go build ./...

      # Android 用 build tag の整合性だけを検査する。CGO_ENABLED=0 では Android の
      # 名前解決を検証できないため、AAR と APK は android ジョブで別途ビルドする。
      - name: Android build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

      - name: go build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go build ./...

      - name: go test (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test -count=1 ./...

      - name: go test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & go test -v -count=1 ./... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/go-test-normal-windows.log"
          $testExit = $LASTEXITCODE
          exit $testExit

      # 実行時間と失敗種別を区別するため race detector を別ステップにする。
      - name: go test -race (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test -count=1 -race ./...

      # windows-2025 x64 は通常 race 対応である。もし toolchain 自身がこの
      # platform を unsupported と明言した場合だけ neutral にし、test failure、
      # compile failure、race report は元の終了 code で失敗させる。
      - name: go test -race (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $raceLines = @(& go test -v -count=1 -race ./... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/go-test-race-windows.log")
          $raceExit = $LASTEXITCODE
          if ($raceExit -eq 0) {
            exit 0
          }
          $raceOutput = (($raceLines | ForEach-Object { "$_" }) -join "`n").Trim()
          if ($raceOutput -ceq '-race is not supported on windows/amd64') {
            Write-Output 'Race unavailable on this runner/toolchain'
            exit 0
          }
          exit $raceExit

      # Console出力が切り詰められても、ConPTY停止時の直前のtest名と出力を
      # 完全な形で取得できるよう、失敗したWindows runだけlogを保存する。
      - name: Upload Windows test logs
        if: ${{ failure() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-test-logs-windows
          path: ${{ runner.temp }}/go-test-*-windows.log
          if-no-files-found: warn
          retention-days: 7

  # gomobile、Gradle、manifest を含む配布経路で APK を検証する。
  # NDK はリポジトリで固定したrevisionだけを使用する。
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # AGP 9 の下限は 17 である。21 は Gradle 9.7 が長期に支える LTS。
          java-version: 21
          cache: gradle

      # gomobile のバージョンは go.mod の tool directive に固定する。
      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: Prepare the pinned Android NDK
        id: android-ndk
        run: scripts/ci/prepare-android-ndk.sh

      - name: gomobile bind
        env:
          SSHC_ANDROID_NDK_HOME: ${{ steps.android-ndk.outputs.path }}
        run: make android-bind ANDROID_NDK_HOME="$SSHC_ANDROID_NDK_HOME"

      # Android SDK を必要としないホスト側ロジックを JVM テストで検証する。
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # 実機に入れられるものを置いていく。debug 署名なので配布物ではないが、
      # 「main の今の APK」を取りに行ける場所がここ以外に無い。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sshc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci

      # 型検査は、アプリケーションと、自前の tsconfig を持つエンドツーエンドの
      # スイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      # TypeScript が検出しない未処理 Promise と React Hooks の規則を検査する。
      # ルールの選定理由は web/eslint.config.mjs を参照。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Buildが書き出したhash付きassetも含め、Go binaryへ埋め込む配布物が
      # Web sourceと一致することを同じjob内で確認する。
      - name: Verify embedded UI assets
        run: ../scripts/ci/check-ui-dist.sh

  pages:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - run: npm ci
      - name: Build Japanese and English documentation
        run: npm run build

  # 3 OS の到達可能性をまとめて解析する。OS 固有シンボルを誤検出しないよう、
  # OS ごとの go ジョブとは分離する。
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make deadcode

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix pages

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # askpass ヘルパーを含むバイナリを統合テスト前にビルドする。
      - name: Build the binary
        run: make build

      # 条件付き PUT と OpenSSH askpass を実装レベルで検証するため、
      # S3 互換サーバーと OpenSSH sshd を起動する。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # アプリケーションはバケットを作成しないため、テスト側で用意する。
        run: |
          docker exec sshc-s3 sh -ceu '
            mkdir -p /data/buckets/sshc-test
            test -d /data/buckets/sshc-test'
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null || \
            echo "::warning::SeaweedFS declined the optional S3 bucket PUT; the verified data directory remains available"

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker ps -a --filter name=sshc-s3 --filter name=sshc-sshd
          docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' sshc-s3 sshc-sshd || true
          docker logs sshc-s3 2>&1 | tail -200
          docker logs sshc-sshd 2>&1 | tail -200

      - name: Stop the containers
        if: always()
        run: make integration-down

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: |
          npm audit --prefix web --audit-level=high
          npm audit --prefix pages --audit-level=high
