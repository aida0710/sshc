# 受け入れのゲート。すべての push とすべての pull request で走る。
#
# ジョブは README.md がすでに記載している四つのコマンドであり、赤いチェックが
# 「ビルド」ではなく壊れたものを名指しできるよう分けてある。ここには、ローカルの
# `make test`、`make verify-generated`、`make e2e` より厳しいものは何もない。CI は
# それらが確かに実行されたことを保証する場所であって、二つ目の基準ではない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチへの二度目の push は一度目を置き換える。ランナーを使う価値があるのは
# 先端だけである。`main` を除外してあるのは、その履歴に完全な記録を残すためだ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            race: true
          - os: macos-15
            name: macOS
            race: true
          - os: windows-2025
            name: Windows
            race: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Windows に Unix shell fragment を解釈させない。formatter も OS ごとの
      # script を使い、違反時は対象 path だけを報告する。
      - name: gofmt (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: scripts/ci/check-gofmt.sh

      - name: gofmt (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/ci/check-gofmt.ps1

      - name: go vet (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go vet ./...

      - name: go vet (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go vet ./...

      - name: go build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go build ./...

      # Android 向けにビルドタグが食い違っていないことだけを見る。**CGO_ENABLED=0
      # で通ることは、Android で動くことを何一つ意味しない** ——Android には
      # /etc/resolv.conf が無いので、本物の AAR は cgo リゾルバを要る。ここは
      # NDK も gomobile も持たないランナーで言えることの上限であり、AAR と APK は
      # 別のジョブの仕事である。
      #
      # Unix 側だけに置く。Android は unix なので、これは Unix の shell fragment で
      # ある。答えはホストに依らないので Linux と macOS で二度走るが、pwsh 版を
      # 並べれば同じ検査の三つ目の写しになるだけである。
      - name: Android build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

      - name: go build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go build ./...

      - name: go test (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test ./...

      - name: go test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go test ./...

      # race detector を別のステップにしてあるのは、それが遅い方だからであり、
      # またデータ競合は、誤った答えとは別種の失敗だからである。
      - name: go test -race (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test -race ./...

      # windows-2025 x64 は通常 race 対応である。もし toolchain 自身がこの
      # platform を unsupported と明言した場合だけ neutral にし、test failure、
      # compile failure、race report は元の終了 code で失敗させる。
      - name: go test -race (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $raceLines = @(& go test -race ./... 2>&1)
          $raceExit = $LASTEXITCODE
          $raceLines | ForEach-Object { Write-Output $_ }
          if ($raceExit -eq 0) {
            exit 0
          }
          $raceOutput = (($raceLines | ForEach-Object { "$_" }) -join "`n").Trim()
          if ($raceOutput -ceq '-race is not supported on windows/amd64') {
            Write-Output 'Race unavailable on this runner/toolchain'
            exit 0
          }
          exit $raceExit

  # 実際に配るもの——APK——が組み上がることを見る。
  #
  # `go` ジョブの Android の段は、engine が android/arm64 へ**コンパイルできる**
  # ことしか言わない。それが通っても、gomobile の bind が落ちる、AAR が gradle の
  # 期待する形で置かれない、manifest が AGP に弾かれる——のどれでも APK は出ない。
  # 出るところまでやって初めて分かる。
  #
  # NDK を自分では入れない。runner の image が持っているものを使う。gradle は
  # native を一切コンパイルしない（.so は AAR に入って来る）ので、NDK を要るのは
  # gomobile だけであり、そこに特定の版を求める理由は無い。
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # AGP 9 の下限は 17 である。21 は Gradle 9.7 が長期に支える LTS。
          java-version: 21
          cache: gradle

      # **バージョンを書かない。** そうすると go.mod の x/mobile がそのまま使われる。
      # gomobile は go.mod の tool から来るので、書けば二か所が別々にずれていく。
      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: gomobile bind
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME" || {
            echo "runner image did not provide an NDK" >&2
            exit 1
          }
          make android-bind ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"

      # **コンパイルが通ることは、動くことではない。** ここが assembleDebug しか
      # 無かった間、外殻の Java は一度も実行されないまま配られていた。端末を
      # 要さない判断は src/test に出してあるので、JVM だけで走る。
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # 実機に入れられるものを置いていく。debug 署名なので配布物ではないが、
      # 「main の今の APK」を取りに行ける場所がここ以外に無い。
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sshc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci

      # 型検査は、アプリケーションと、自前の tsconfig を持つエンドツーエンドの
      # スイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      # **ここにあるのは、型検査に原理的にできないことだけである。**
      #
      # 長いあいだこの段は無く、「lint の役目は型検査が担う」と決めてあった。
      # それは大筋で正しい——名前の間違いも形の食い違いも tsc が捕まえる。
      # だが tsc が見ないものが二種類ある: **待ち忘れた Promise** と、**React の
      # 規則**である。どちらも型としては正しく、走らせて初めて壊れる。
      #
      # 実際、規則を入れる前から `react-hooks/exhaustive-deps` を名指しで抑止する
      # コメントが 9 箇所あった。**規則の側は一度も走っていなかった。**
      #
      # 何を入れなかったかは web/eslint.config.mjs に書いてある。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # **参照ゼロを見つける仕組みが無かった。** Electron と生体認証を消したとき、
  # windowsregistry package（130 行）と Vault.Wrap は書き手が消えたまま残った。
  # どちらもコンパイルは通り続けるので、見張らなければ誰も気づかない。
  #
  # **go のジョブに置かない。** あちらは OS ごとに走るが、この検査は 1 回の中で
  # 3 つの OS すべてを見る——`_windows.go` からしか呼ばれないものは Linux から
  # 見れば死んで見えるので、積を取らなければ嘘をつく。
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make deadcode

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # このバイナリが askpass ヘルパーそのものなので、ssh が走る前に存在して
      # いなければならない。
      - name: Build the binary
        run: make build

      # このスイートが有用な形では偽装できないサーバーが二つある。本物の S3 実装 —
      # 同期の設計全体が、本物のそれが条件付き PUT に何をするかの上に立っている
      # ため — と、本物の sshd である。askpass ヘルパーが渡したものを OpenSSH が
      # 受け取るかどうかは、スタブに答えられる問いではない。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # クライアントには意図的に CreateBucket がない。アプリケーションが
        # バケットを作らないので、クライアントを広げる代わりにハーネスが行う。
        run: |
          docker exec sshc-s3 sh -c '
            mkdir -p /data/buckets/sshc-test' || true
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null 2>&1 || true

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker logs sshc-s3 2>&1 | tail -50
          docker logs sshc-sshd 2>&1 | tail -50

      - name: Stop the containers
        if: always()
        run: make integration-down

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Build the binary
        run: make build

      # UI はコミット済みのバンドルからバイナリへ埋め込まれる。したがって、
      # ビルドし直されないままの web/src の変更は、クリーンなチェックアウトから
      # ビルドした人へ古いインターフェースを配ることになる。上の `make build` が
      # いま再生成したので、ここに差分があればコミットがそれを忘れたということだ。
      - name: The committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- internal/ui/dist; then
            echo "internal/ui/dist is stale. Run: make build, and commit the result." >&2
            exit 1
          fi

      # Chromium のスイートはビルド済みのバイナリを localhost 越しに動かす。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npm run e2e --prefix web

      # **成果物は上げない。上げられるものが無い。**
      #
      # reporter は list だけなので playwright-report は作られず、この step は
      # 今まで何も上げていなかった——失敗したとき何かが残ると思わせるだけの
      # 設定だった。
      #
      # **代わりに test-results を上げてはならない。** あそこには
      # error-context.md が入り、それはページの写しである。この製品の e2e は
      # 設計上ひとつの流れで秘密鍵を画面に出すので、成果物置き場はまさに
      # それが忘れられる場所になる（playwright.config.ts が trace も video も
      # screenshot も切っているのは同じ理由である）。診断は表明の文と
      # サーバー自身の出力から行う。

  # **Windows でも同じスイートを走らせる。** ここが無いと、次に誰かが Unix の
  # 前提を書いた瞬間に静かに壊れる——実際、初めて実機で走らせたとき 8 件が
  # 落ち、その全部がテスト側の Unix 前提だった（POSIX のシェル構文、mode
  # ビット、fixture が DACL を満たしていないこと）。
  #
  # **Linux のジョブとは要るものが違うので、別に置く。** あちらはコミット済み
  # バンドルの鮮度も見て、Go の側の検査も抱えている。こちらが確かめる
  # のは、**ブラウザから見た製品が Windows でも同じように振る舞うか**である
  # ——ConPTY を実際に踏む唯一の経路がここにある。
  e2e-windows:
    name: End to end (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Build the binary
        run: go run ./internal/nativebuild/cmd/nativebuild host-build --output-dir bin

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npm run e2e --prefix web

      # **成果物は上げない。上げられるものが無い。**
      #
      # reporter は list だけなので playwright-report は作られず、この step は
      # 今まで何も上げていなかった——失敗したとき何かが残ると思わせるだけの
      # 設定だった。
      #
      # **代わりに test-results を上げてはならない。** あそこには
      # error-context.md が入り、それはページの写しである。この製品の e2e は
      # 設計上ひとつの流れで秘密鍵を画面に出すので、成果物置き場はまさに
      # それが忘れられる場所になる（playwright.config.ts が trace も video も
      # screenshot も切っているのは同じ理由である）。診断は表明の文と
      # サーバー自身の出力から行う。

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: npm audit --prefix web --audit-level=high
