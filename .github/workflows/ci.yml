# すべての push と pull request に対する検証ワークフロー。
# ジョブは失敗した検査を識別できる単位に分割する。
#
# go、web、deadcode、generated の各ジョブの検査は、ローカルの `make test` と
# `make verify-generated` にそろえる。ただし Windows だけの段と、web の axe 検査は
# ローカルのこの 2 つに含まれない。E2E は時間がかかるので、CI では主要画面の axe
# 検査だけを走らせ、全体は `make e2e` でローカル実行する。統合テストは
# `make integration` でも走らせられる。Android の APK、VPN のコンテナイメージ、
# 文書サイトのビルド、依存の脆弱性は CI だけで確かめる。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへの新しい push では実行中の古いジョブを取り消す。
# `main` は全コミットの検証結果を保持するため対象外とする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # PR で変わったパスを見て、Windows と macOS の Go のテストが要るかを決める。画面と文書だけの
  # PR では、この 2 つ（Windows の go test が約 10 分）が CI の時間を律速していた。
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.native.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR では merge commit を取り出すので、1 つ目の親（base）との差分が PR の変更になる。
          fetch-depth: 2
      - name: Decide whether the Windows and macOS Go tests run
        id: native
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          needed=$(git diff --name-only HEAD^1 HEAD | scripts/ci/native-tests-needed.sh)
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  # 埋め込む画面を1回だけ組み立て、Go のテストと Android の job へ渡す。画面はリポジトリに
  # 入れていない（internal/ui/dist/README.md）。Go のテストのうち2つが、組み立てた画面を読む。
  ui:
    name: Web UI build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build the web UI
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ui
          path: internal/ui/dist/app
          if-no-files-found: error
          retention-days: 1

  go:
    name: Go native (${{ matrix.name }})
    needs: [changes, ui]
    # jobs.changes が失敗しても、この job は走らせる。依存先の失敗で飛ばされた必須の検査は
    # 成功に見えるので、テストを流さないまま PR がマージできてしまう。jobs.ui が失敗したときは、
    # 画面を受け取る手順で落ちる。
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    env:
      # Linux はいつも、Windows と macOS は Go に関わる変更があるときだけ手順を流す（jobs.changes）。
      # 必須の検査の名前を残すため、job ごと飛ばさずに手順を飛ばす。jobs.changes の答えが無いとき
      # （失敗したとき）は、false ではないので流す側に倒れる。
      NATIVE_TESTS: ${{ matrix.name == 'Linux' || needs.changes.outputs.native != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # goBuildCache は、その OS での go env GOCACHE の既定の場所である。
          - os: ubuntu-24.04
            name: Linux
            timeoutMinutes: 30
            goBuildCache: ~/.cache/go-build
          - os: macos-15
            name: macOS
            timeoutMinutes: 30
            goBuildCache: ~/Library/Caches/go-build
          - os: windows-2025
            name: Windows
            timeoutMinutes: 30
            goBuildCache: ~/AppData/Local/go-build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ env.NATIVE_TESTS == 'true' }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ env.NATIVE_TESTS == 'true' }}
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          # setup-go のキャッシュは go.sum だけで鍵を作るので、依存が変わらない限り作り直されず、
          # そのあとに変わったパッケージを毎回コンパイルし直していた（2026-10-27 に、Windows と
          # macOS のキャッシュは 10 月 22 日のままだった）。下の手順で、main のコミットごとに
          # 作り直すキャッシュを使う。
          cache: false
      # PR と main への push は、main が最後に保存したビルドのキャッシュから始める。
      - name: Restore the Go build cache
        if: ${{ env.NATIVE_TESTS == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.goBuildCache }}
            ~/go/pkg/mod
          key: go-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            go-${{ matrix.name }}-
      # CSP の trusted-types の検査と、バイナリが埋め込んだ画面を配るかの検査は、組み立てた画面を読む。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ env.NATIVE_TESTS == 'true' }}
        with:
          name: web-ui
          path: internal/ui/dist/app

      # テストより前に、TEMP を作業用のディスクへ移す。理由は scripts/ci/windows-fast-temp.ps1。
      - name: Move TEMP off the system drive (Windows)
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        run: ./scripts/ci/windows-fast-temp.ps1

      - name: Skip the Go tests for a web-only change
        if: ${{ env.NATIVE_TESTS != 'true' }}
        shell: bash
        run: echo "Only web or docs changed; the Linux job runs the Go tests."

      # Windows に Unix shell fragment を解釈させない。formatter も OS ごとの
      # script を使い、違反時は対象 path だけを報告する。
      - name: gofmt (Unix)
        if: ${{ runner.os != 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: scripts/ci/check-gofmt.sh

      - name: gofmt (Windows)
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        run: ./scripts/ci/check-gofmt.ps1

      # 利用者が実行するWindows PowerShell 5.1自身でinstallerを構文解析する。
      # pwsh 7だけでは5.1固有の非互換を見落とすため、shellも明示する。
      - name: Windows PowerShell installer syntax
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: powershell
        run: |
          $errors = @()
          foreach ($path in @('install.ps1', 'scripts/ci/install-windows-smoke.ps1')) {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$fileErrors
            ) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: go vet (Unix)
        if: ${{ runner.os != 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: go vet ./...

      - name: go vet (Windows)
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        run: go vet ./...

      - name: go build (Unix)
        if: ${{ runner.os != 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: go build ./...

      # Android 用 build tag の整合性だけを検査する。CGO_ENABLED=0 では Android の
      # 名前解決を検証できないため、AAR と APK は android ジョブで別途ビルドする。
      - name: Android build (Unix)
        if: ${{ runner.os != 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

      # FreeBSD・OpenBSD はリリースしていないが、ビルドが通る状態を保つ。build tag の
      # 整合性はどのランナーでも同じなので、Linux でだけ見る。
      - name: BSD build (Linux)
        if: ${{ runner.os == 'Linux' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: |
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=openbsd GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: go build (Windows)
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        run: go build ./...

      # テストは OS ごとに 1 回、race detector を付けて流す。race の下でだけ外れるテストは
      # 無いので、race を付けない実行は同じテストの繰り返しになる。PR でも main への push でも
      # 同じものを流す。タグ sshc_test_kdf は、鍵の導出の強さを確かめないテストで Argon2id の
      # コストを下げる（internal/envelope/derivation_cost_sshc_test_kdf.go）。
      - name: go test -race (Unix)
        if: ${{ runner.os != 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        run: go test -count=1 -race -tags sshc_test_kdf ./...

      # windows/amd64 は Go の race detector の対応先なので、例外を設けず、
      # go test の終了コードをそのまま返す。
      - name: go test -race (Windows)
        if: ${{ runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & go test -v -count=1 -race -tags sshc_test_kdf ./... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/go-test-race-windows.log"
          $raceExit = $LASTEXITCODE
          exit $raceExit

      # 保存する前に、この実行で使わなかったビルドの出力を消す。Go はキャッシュの項目を使うと、
      # 最後に触ってから1時間を過ぎていれば更新時刻を今にする。そのため、この実行で使った項目は
      # どれも、更新時刻が「1時間 + job の長さ」より新しい。2時間より古い項目は使っていないので
      # 消してよい。消さないと、キャッシュはコミットごとに増え続ける（Linux で40分に296MBから421MB）。
      - name: Drop build outputs this run did not use (Unix)
        if: ${{ runner.os != 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NATIVE_TESTS == 'true' }}
        shell: bash
        env:
          GO_BUILD_CACHE: ${{ matrix.goBuildCache }}
        # matrix.goBuildCache は ~ で始まる。引用の中の ~ は展開されないので置き換える。
        run: find "${GO_BUILD_CACHE/#\~/$HOME}" -type f -mmin +120 -delete
      - name: Drop build outputs this run did not use (Windows)
        if: ${{ runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NATIVE_TESTS == 'true' }}
        shell: pwsh
        env:
          GO_BUILD_CACHE: ${{ matrix.goBuildCache }}
        run: |
          $unused = (Get-Date).AddMinutes(-120)
          $directory = $env:GO_BUILD_CACHE -replace '^~', $HOME
          Get-ChildItem -LiteralPath $directory -Recurse -File | Where-Object { $_.LastWriteTime -lt $unused } | Remove-Item -Force

      # main への push だけが、テストを通ったビルドのキャッシュを保存する。PR は保存しない
      # （PR のキャッシュはほかの PR から使えず、容量だけを使う）。
      - name: Save the Go build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NATIVE_TESTS == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.goBuildCache }}
            ~/go/pkg/mod
          key: go-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Console出力が切り詰められても、ConPTY停止時の直前のtest名と出力を
      # 完全な形で取得できるよう、失敗したWindows runだけlogを保存する。
      - name: Upload Windows test logs
        if: ${{ failure() && runner.os == 'Windows' && env.NATIVE_TESTS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-test-logs-windows
          path: ${{ runner.temp }}/go-test-*-windows.log
          if-no-files-found: warn
          retention-days: 7

  # main への push で jobs.go が保存したビルドのキャッシュが置き換えた、同じ OS の古いキャッシュを
  # 消す。次の実行が復元するのはいつも一番新しいものなので、古いものは容量を使うだけである。
  # 残すと、リポジトリの上限（10GB）に達し、npm や Gradle のキャッシュが押し出される
  # （2026-10-27 に9.998GBだった）。この commit のキャッシュを保存しなかった OS（Go に関わらない
  # 変更で Windows と macOS のテストを飛ばしたとき）は、前のものを残す。
  go-cache-cleanup:
    name: Go build cache cleanup
    needs: go
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the Go build caches the new ones replace
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for os in Linux macOS Windows; do
            keys=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "go-$os-" --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"')
            if ! grep -q -- "-$SHA\$" <<<"$keys"; then
              echo "go-$os: no cache saved for $SHA; keeping the previous ones"
              continue
            fi
            grep -v -- "-$SHA\$" <<<"$keys" | while read -r id key; do
              [ -n "$id" ] || continue
              echo "deleting $key"
              gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
            done
          done

  # gomobile、Gradle、manifest を含む配布経路で APK を検証する。
  # NDK はリポジトリで固定したrevisionだけを使用する。
  android:
    name: Android APK
    needs: ui
    # jobs.ui が失敗しても、この job は走らせて、画面を受け取る手順で落とす。依存先の失敗で
    # 飛ばされた必須の検査は成功に見えるので、APK を確かめないまま PR がマージできてしまう。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # AAR はエンジンと一緒に画面を埋め込む（jobs.ui が組み立てたもの）。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-ui
          path: internal/ui/dist/app
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # AGP 9 の下限は 17 である。21 は Gradle 9.7 が長期に支える LTS。
          java-version: 21
          cache: gradle

      # gomobile のバージョンは go.mod の tool directive に固定する。
      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: Prepare the pinned Android NDK
        id: android-ndk
        run: scripts/ci/prepare-android-ndk.sh

      - name: gomobile bind
        env:
          SSHC_ANDROID_NDK_HOME: ${{ steps.android-ndk.outputs.path }}
        run: make android-bind ANDROID_NDK_HOME="$SSHC_ANDROID_NDK_HOME"

      # Android SDK を必要としないホスト側ロジックを JVM テストで検証する。
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # 実機に入れられるものを置いていく。debug 署名なので配布物ではないが、
      # 「main の今の APK」を取りに行ける場所がここ以外に無い。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sshc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # 画面の検査は、型・lint・組み立て・axe（web-checks）と、単体テスト（web-unit）に分けて
  # 並べて流す。単体テストが Web の時間の大半（約3分40秒）を占めていたので、ファイルで
  # 分けて並べる。テストが増えたら shard の数を増やす。必須の検査「Web」は、両方の結果を
  # まとめる jobs.web が出す。
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci
      - name: Browser demo archive and release proxy tests
        run: npm test --prefix ../demo

      # 型検査は、アプリケーションと、自前の tsconfig を持つエンドツーエンドの
      # スイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      # TypeScript が検出しない未処理 Promise と React Hooks の規則を検査する。
      # ルールの選定理由は web/eslint.config.mjs を参照。
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # axe は実際に配布するUIをsshc engineから開いて検査する。全E2Eはローカルに
      # 残し、主要画面の重大なWCAG違反だけをPRごとに短時間で検出する。
      - name: Build accessibility test engine
        run: mkdir -p ../bin && go build -o ../bin/sshc ../cmd/sshc

      # runner に最初から入っている Google Chrome で走らせ、Chromium をダウンロードしない。
      # ダウンロードは、遅い日に止まって検査ごと取り消されていた（2026-10-26）。
      - name: Accessibility tests
        env:
          SSHC_E2E_BROWSER_CHANNEL: chrome
        run: npm run e2e -- --project=chromium --output="$RUNNER_TEMP/playwright-results" e2e/accessibility.spec.ts

  web-unit:
    name: Web unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # 必須の検査「Web」。分けた画面の job がすべて成功したときだけ成功する。どれかが失敗・
  # 取り消し・飛ばしで終わったら失敗する。
  web:
    name: Web
    needs: [web-checks, web-unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every web job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a web job ended with $result (all: $RESULTS)" >&2
              exit 1
            fi
          done

  pages:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - run: npm ci
      - name: Build Japanese and English documentation
        run: npm run build

  # 3 OS の到達可能性をまとめて解析する。OS 固有シンボルを誤検出しないよう、
  # OS ごとの go ジョブとは分離する。
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make deadcode

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix pages

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  # VPN のコンテナイメージは、利用者のマシンの上で作る。arm64（Apple Silicon の
  # mac など）はパッケージの取得元が amd64 と違うので、両方で作れることを確かめる。
  vpn-image:
    name: VPN image (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: amd64
          - os: ubuntu-24.04-arm
            name: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR では merge commit を、main への push では squash したコミットを取り出すので、
          # 1 つ目の親との差分がその変更になる。
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # internal/vpn のテストとコンテナに関わる変更のときだけ、イメージを組み立てて確かめる。
      # 理由は scripts/ci/vpn-image-tests-needed.sh。手動の実行ではいつも確かめる。
      - name: Decide whether the VPN image check runs
        id: vpn
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          needed=$(git diff --name-only HEAD^1 HEAD | scripts/ci/vpn-image-tests-needed.sh)
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      # イメージは、main が保存したもの（docker save のファイル）をキャッシュから読み込む。
      # Dockerfile は Ubuntu の snapshot の時刻とパッケージを固定しているので、タグ（中身から
      # 決まる）が同じなら中身も同じである。毎回 snapshot.ubuntu.com から組み立てると、その
      # 障害で CI が落ち、run 全体の成功を待つ Release の公開も止まる（2026-10-27 の main の
      # 失敗4回はすべてこれだった）。読み込んだイメージはエンジンが付けるタグなので、結合
      # テストはそれを見つけて使い、組み立て直さない（ensureImage）。
      # リポジトリは GitHub のアクションしか許していないので、buildx のアクションは使わない。
      - name: Choose the image tag the engine uses
        if: ${{ steps.vpn.outputs.needed != 'false' }}
        id: image
        run: echo "tag=sshc-vpn-test:$(scripts/ci/vpn-image-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Restore the VPN container image
        if: ${{ steps.vpn.outputs.needed != 'false' }}
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vpn-image.tar
          key: vpn-image-${{ matrix.name }}-${{ steps.image.outputs.tag }}
      - name: Load the VPN container image
        if: ${{ steps.vpn.outputs.needed != 'false' && steps.image-cache.outputs.cache-hit == 'true' }}
        run: docker load --input "$RUNNER_TEMP/vpn-image.tar"
      - name: Build the VPN container image
        if: ${{ steps.vpn.outputs.needed != 'false' && steps.image-cache.outputs.cache-hit != 'true' }}
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: docker build --tag "$TAG" internal/vpn/container
      # 保存は main だけにする。PR のキャッシュはほかの PR から使えない。手動の実行（いつも
      # イメージを確かめる）でも保存するので、キャッシュが無いときは main で手動で流して作れる。
      - name: Write the VPN container image for the cache
        if: ${{ steps.vpn.outputs.needed != 'false' && steps.image-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: docker save --output "$RUNNER_TEMP/vpn-image.tar" "$TAG"
      - name: Save the VPN container image
        if: ${{ steps.vpn.outputs.needed != 'false' && steps.image-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vpn-image.tar
          key: vpn-image-${{ matrix.name }}-${{ steps.image.outputs.tag }}
      # IKEv2/IPsec は、トンネルをカーネルの XFRM インターフェースに結び付ける。
      # runner のカーネル（amd64 と arm64）で、テストの中で立てた strongSwan の
      # サーバーへ実際に接続できることを確かめる。L2TP/IPsec は、既定の暗号スイートで
      # 組み合わせを1つしか受け付けないサーバーと IPsec を確立できることを確かめる。
      # IKEv1 で送られる候補は、イメージの strongSwan のプラグインで変わる。
      - name: Connect through IKEv2/IPsec and L2TP/IPsec in the VPN container
        if: ${{ steps.vpn.outputs.needed != 'false' }}
        env:
          SSHC_VPN_DOCKER_TEST: "1"
        run: go test ./internal/vpn -run 'IKEv2|L2TP' -count=1 -timeout 15m

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # askpass ヘルパーを含むバイナリを統合テスト前にビルドする。
      - name: Build the binary
        run: make build

      # 条件付き PUT と OpenSSH askpass を実装レベルで検証するため、
      # S3 互換サーバーと OpenSSH sshd を起動する。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # アプリケーションはバケットを作成しないため、テスト側で用意する。
        run: |
          docker exec sshc-s3 sh -ceu '
            mkdir -p /data/buckets/sshc-test
            test -d /data/buckets/sshc-test'
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null || \
            echo "::warning::SeaweedFS declined the optional S3 bucket PUT; the verified data directory remains available"

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker ps -a --filter name=sshc-s3 --filter name=sshc-sshd
          docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' sshc-s3 sshc-sshd || true
          docker logs sshc-s3 2>&1 | tail -200
          docker logs sshc-sshd 2>&1 | tail -200

      - name: Stop the containers
        if: always()
        run: make integration-down

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: |
          npm audit --prefix web --audit-level=high
          npm audit --prefix pages --audit-level=high
