# すべての push と pull request に対する検証ワークフロー。
# ジョブは失敗した検査を識別できる単位に分割する。検査内容はローカルの
# `make test`、`make verify-generated`、`make e2e` と一致させる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチへの新しい push では実行中の古いジョブを取り消す。
# `main` は全コミットの検証結果を保持するため対象外とする。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            race: true
          - os: macos-15
            name: macOS
            race: true
          - os: windows-2025
            name: Windows
            race: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Windows に Unix shell fragment を解釈させない。formatter も OS ごとの
      # script を使い、違反時は対象 path だけを報告する。
      - name: gofmt (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: scripts/ci/check-gofmt.sh

      - name: gofmt (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/ci/check-gofmt.ps1

      - name: go vet (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go vet ./...

      - name: go vet (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go vet ./...

      - name: go build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go build ./...

      # Android 用 build tag の整合性だけを検査する。CGO_ENABLED=0 では Android の
      # 名前解決を検証できないため、AAR と APK は android ジョブで別途ビルドする。
      - name: Android build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

      - name: go build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go build ./...

      - name: go test (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test ./...

      - name: go test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go test ./...

      # 実行時間と失敗種別を区別するため race detector を別ステップにする。
      - name: go test -race (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test -race ./...

      # windows-2025 x64 は通常 race 対応である。もし toolchain 自身がこの
      # platform を unsupported と明言した場合だけ neutral にし、test failure、
      # compile failure、race report は元の終了 code で失敗させる。
      - name: go test -race (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $raceLines = @(& go test -race ./... 2>&1)
          $raceExit = $LASTEXITCODE
          $raceLines | ForEach-Object { Write-Output $_ }
          if ($raceExit -eq 0) {
            exit 0
          }
          $raceOutput = (($raceLines | ForEach-Object { "$_" }) -join "`n").Trim()
          if ($raceOutput -ceq '-race is not supported on windows/amd64') {
            Write-Output 'Race unavailable on this runner/toolchain'
            exit 0
          }
          exit $raceExit

  # gomobile、Gradle、manifest を含む配布経路で APK を検証する。
  # NDK は runner image の既存バージョンを使用する。
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # AGP 9 の下限は 17 である。21 は Gradle 9.7 が長期に支える LTS。
          java-version: 21
          cache: gradle

      # gomobile のバージョンは go.mod の tool directive に固定する。
      - name: Install gobind
        run: go install golang.org/x/mobile/cmd/gobind

      - name: gomobile bind
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME" || {
            echo "runner image did not provide an NDK" >&2
            exit 1
          }
          make android-bind ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"

      # Android SDK を必要としないホスト側ロジックを JVM テストで検証する。
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # 実機に入れられるものを置いていく。debug 署名なので配布物ではないが、
      # 「main の今の APK」を取りに行ける場所がここ以外に無い。
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sshc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci

      # 型検査は、アプリケーションと、自前の tsconfig を持つエンドツーエンドの
      # スイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      # TypeScript が検出しない未処理 Promise と React Hooks の規則を検査する。
      # ルールの選定理由は web/eslint.config.mjs を参照。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # 3 OS の到達可能性をまとめて解析する。OS 固有シンボルを誤検出しないよう、
  # OS ごとの go ジョブとは分離する。
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make deadcode

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # askpass ヘルパーを含むバイナリを統合テスト前にビルドする。
      - name: Build the binary
        run: make build

      # 条件付き PUT と OpenSSH askpass を実装レベルで検証するため、
      # S3 互換サーバーと OpenSSH sshd を起動する。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # アプリケーションはバケットを作成しないため、テスト側で用意する。
        run: |
          docker exec sshc-s3 sh -c '
            mkdir -p /data/buckets/sshc-test' || true
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null 2>&1 || true

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker logs sshc-s3 2>&1 | tail -50
          docker logs sshc-sshd 2>&1 | tail -50

      - name: Stop the containers
        if: always()
        run: make integration-down

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Build the binary
        run: make build

      # web/src とコミット済みの埋め込みバンドルが一致することを確認する。
      - name: The committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- internal/ui/dist; then
            echo "internal/ui/dist is stale. Run: make build, and commit the result." >&2
            exit 1
          fi

      # ビルド済みバイナリを localhost で起動し、Chromium から検証する。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npm run e2e --prefix web

      # E2E の出力には秘密情報が含まれる可能性があるため、レポート、trace、
      # video、screenshot、test-results はアップロードしない。

  # Windows 固有のプロセス、ACL、ConPTY を含むブラウザ操作を検証する。
  # Linux ジョブとは依存関係が異なるため、別ジョブとして実行する。
  e2e-windows:
    name: End to end (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      - name: Build the binary
        run: go run ./internal/nativebuild/cmd/nativebuild host-build --output-dir bin

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npm run e2e --prefix web

      # E2E の出力には秘密情報が含まれる可能性があるため、レポート、trace、
      # video、screenshot、test-results はアップロードしない。

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: npm audit --prefix web --audit-level=high
