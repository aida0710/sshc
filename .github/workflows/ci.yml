# 受け入れのゲート。すべての push とすべての pull request で走る。
#
# ジョブは README.md がすでに記載している四つのコマンドであり、赤いチェックが
# 「ビルド」ではなく壊れたものを名指しできるよう分けてある。ここには、ローカルの
# `make test`、`make verify-generated`、`make e2e` より厳しいものは何もない。CI は
# それらが確かに実行されたことを保証する場所であって、二つ目の基準ではない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチへの二度目の push は一度目を置き換える。ランナーを使う価値があるのは
# 先端だけである。`main` を除外してあるのは、その履歴に完全な記録を残すためだ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            race: true
          - os: macos-15
            name: macOS
            race: true
          - os: windows-2025
            name: Windows
            race: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # バージョンは go.mod から来る。ツールチェーンを変えられる場所を
          # 一か所に限るためである。
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Windows に Unix shell fragment を解釈させない。formatter も OS ごとの
      # script を使い、違反時は対象 path だけを報告する。
      - name: gofmt (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: scripts/ci/check-gofmt.sh

      - name: gofmt (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/ci/check-gofmt.ps1

      - name: go vet (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go vet ./...

      - name: go vet (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go vet ./...

      - name: go build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go build ./...

      # Android 向けにビルドタグが食い違っていないことだけを見る。**CGO_ENABLED=0
      # で通ることは、Android で動くことを何一つ意味しない** ——Android には
      # /etc/resolv.conf が無いので、本物の AAR は cgo リゾルバを要る。ここは
      # NDK も gomobile も持たないランナーで言えることの上限であり、AAR と APK は
      # 別のジョブの仕事である。
      #
      # Unix 側だけに置く。Android は unix なので、これは Unix の shell fragment で
      # ある。答えはホストに依らないので Linux と macOS で二度走るが、pwsh 版を
      # 並べれば同じ検査の三つ目の写しになるだけである。
      - name: Android build (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...

      - name: go build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go build ./...

      - name: go test (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test ./...

      - name: go test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: go test ./...

      # race detector を別のステップにしてあるのは、それが遅い方だからであり、
      # またデータ競合は、誤った答えとは別種の失敗だからである。
      - name: go test -race (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: go test -race ./...

      # windows-2025 x64 は通常 race 対応である。もし toolchain 自身がこの
      # platform を unsupported と明言した場合だけ neutral にし、test failure、
      # compile failure、race report は元の終了 code で失敗させる。
      - name: go test -race (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $raceLines = @(& go test -race ./... 2>&1)
          $raceExit = $LASTEXITCODE
          $raceLines | ForEach-Object { Write-Output $_ }
          if ($raceExit -eq 0) {
            exit 0
          }
          $raceOutput = (($raceLines | ForEach-Object { "$_" }) -join "`n").Trim()
          if ($raceOutput -ceq '-race is not supported on windows/amd64') {
            Write-Output 'Race unavailable on this runner/toolchain'
            exit 0
          }
          exit $raceExit

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` はロックされたバージョンをそのままインストールし、lockfile と
      # package.json が食い違えば失敗する。このプロジェクトはすべての依存を固定
      # するので、固定を外れたずれは、インストールされるのではなくビルドを止める
      # べきである。
      - run: npm ci

      # ここに ESLint はない。lint の役目は型検査が担う。アプリケーションと、
      # 自前の tsconfig を持つエンドツーエンドのスイートの両方に対して走る。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  desktop:
    name: Desktop pure Node lifecycle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15
            name: macOS
          - os: windows-2025
            name: Windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: npm ci --prefix desktop

      - name: Install desktop dependencies (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: npm ci --prefix desktop

      # Electron の描画そのものは手動受け入れに残す。ここでは、外殻が持つ
      # link・入口URL・二重起動時のウィンドウ復帰を Node 標準テストで検査する。
      - name: Lifecycle tests (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: npm test --prefix desktop

      - name: Lifecycle tests (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: npm test --prefix desktop

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # api/openapi.yaml は、Go のモデルと TypeScript の型にとって唯一の源で
      # ある。ここで両方を再生成し、差分があれば失敗させる。これにより、手で
      # 編集された生成物が main へ届くことはない。
      - name: make verify-generated
        run: make verify-generated

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # このバイナリが askpass ヘルパーそのものなので、ssh が走る前に存在して
      # いなければならない。
      - name: Build the binary
        run: make build

      # このスイートが有用な形では偽装できないサーバーが二つある。本物の S3 実装 —
      # 同期の設計全体が、本物のそれが条件付き PUT に何をするかの上に立っている
      # ため — と、本物の sshd である。askpass ヘルパーが渡したものを OpenSSH が
      # 受け取るかどうかは、スタブに答えられる問いではない。
      - name: Start SeaweedFS and sshd
        run: make integration-up

      - name: Create the bucket
        # クライアントには意図的に CreateBucket がない。アプリケーションが
        # バケットを作らないので、クライアントを広げる代わりにハーネスが行う。
        run: |
          docker exec sshc-s3 sh -c '
            mkdir -p /data/buckets/sshc-test' || true
          curl -sS -X PUT "http://127.0.0.1:8333/sshc-test" \
            -H "Authorization: none" >/dev/null 2>&1 || true

      - name: Integration tests
        run: make integration

      - name: Container logs
        if: failure()
        run: |
          docker logs sshc-s3 2>&1 | tail -50
          docker logs sshc-sshd 2>&1 | tail -50

      - name: Stop the containers
        if: always()
        run: make integration-down

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop

      - name: Build the binary
        run: make build

      # UI はコミット済みのバンドルからバイナリへ埋め込まれる。したがって、
      # ビルドし直されないままの web/src の変更は、クリーンなチェックアウトから
      # ビルドした人へ古いインターフェースを配ることになる。上の `make build` が
      # いま再生成したので、ここに差分があればコミットがそれを忘れたということだ。
      - name: The committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- internal/ui/dist; then
            echo "internal/ui/dist is stale. Run: make build, and commit the result." >&2
            exit 1
          fi

      # Chromium のスイートはビルド済みのバイナリを localhost 越しに動かす。
      # Linux では加えて、同じバイナリを子にする実 Electron も一度起動する。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        # desktop.spec.ts は実際の Electron ウィンドウを開く。Playwright の
        # --with-deps が用意する Xvfb の中で、Chromium の残りと一緒に走らせる。
        run: xvfb-run --auto-servernum npm run e2e --prefix web

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go vulnerability reachability
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: npm vulnerability audit
        run: npm audit --prefix web --audit-level=high
