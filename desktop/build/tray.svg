<!--
  メニューバーの図。**icon.svg と同じ印である**——path の数字は一文字も
  変えずに写してある。あちらの座標系（512）をそのまま使っているのは、
  そのためである。

  違うのは二つだけ。

  **色を持たない。** macOS は Template で終わる名前の図を、明暗に合わせて
  自分で塗る。読むのは輪郭（alpha）だけなので、ここでの黒は「不透明」と
  いう意味しか持たない。

  **1.7 倍に伸ばしてある。** icon.svg の印は 512 の面の 47% しか使っていない
  ——あちらには丸角の下地があるからである。ここには何も無いので、そのままだと
  16px の中で豆粒になる。線幅はあちらと同じ 28 のままにしてある。太くすると
  16px では内側が潰れて、輪郭が一本の棒になる——1.5〜1.9 倍と 28〜32 を実際に
  焼いて並べて選んだ。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g transform="translate(256,256) scale(1.7) translate(-256,-256)">
    <path d="M136 166H244L288 210H376V346H268L224 302H136Z"
          fill="none" stroke="#000000" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="304" y="248" width="24" height="52" rx="3" fill="#000000"/>
  </g>
</svg>
