<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="58%" stop-color="#667EEA"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <!--
    短い横棒はこちらを使う。**あの path は高さが 0 なので、objectBoundingBox の
    グラデーションでは描かれない**（退化したバウンディングボックスを持つ要素は
    描画されない、と仕様が決めている）。実際、上のグラデーションのままだと
    あの棒はどの描画系でも消える。ここだけを user space に置き、大きい方の
    見え方には一切触れない。
  -->
  <linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="136" y1="166" x2="376" y2="346">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="58%" stop-color="#667EEA"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="#09111F"/>

<g fill="none" stroke="url(#g)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
  <path d="M136 166H244L288 210H376V346H268L224 302H136Z"/>
</g>
<path d="M174 246H222" fill="none" stroke="url(#gb)" stroke-width="28" stroke-linecap="round"/>
<rect x="304" y="248" width="24" height="52" rx="3" fill="#EAF2FF"/>
</svg>