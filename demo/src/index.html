<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sshc · ブラウザデモ</title>
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./xterm.css">
</head>
<body>
  <header><strong>sshc</strong><span data-message="demoTitle"></span><button id="reset" data-message="reset" hidden></button></header>
  <main>
    <section id="confirmation" aria-labelledby="confirmation-title">
      <p class="eyebrow" data-message="noInstall"></p>
      <h1 id="confirmation-title" data-message="heading"></h1>
      <p data-message="introduction"></p>
      <table><thead><tr><th data-message="machine"></th><th data-message="purpose"></th><th data-message="memory"></th></tr></thead><tbody id="machine-list"></tbody></table>
      <p class="detail" id="memory-detail"></p>
      <p class="confirm-question" data-message="confirm"></p>
      <button id="start" class="primary" data-message="start"></button>
    </section>
    <section id="demo" hidden>
      <div id="status" role="status" aria-live="polite"></div>
      <nav><button id="web-tab" aria-pressed="true" data-message="webTab"></button><button id="cli-tab" aria-pressed="false" data-message="cliTab"></button></nav>
      <div id="web-panel"><iframe id="sshc-ui" title="sshc Web UI" hidden></iframe></div>
      <div id="cli-panel" hidden><p class="cli-hint"><span data-message="commandExamples"></span> <code>sshc ssh demo-a</code>　<code>sshc ssh demo-b</code>　<code>sshc status</code></p><div id="cli"></div></div>
    </section>
  </main>
  <script src="./v86/libv86.js"></script>
  <script src="./xterm.js"></script>
  <script src="./addon-fit.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
