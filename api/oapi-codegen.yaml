package: api
output: models.gen.go
generate:
  models: true
output-options:
  skip-prune: false
  # 次の型は internal/application で定義する。重複生成すると optional の表現や
  # 名前付き型の制約が失われるため、生成対象から除外する。OpenAPI との整合性は
  # internal/acceptance/contract_drift_test.go で検証する。
  exclude-schemas:
    - CreateConnectionResponse
    - Effective
    - EffectiveChange
    - EffectiveDiff
    - EffectiveEntry
    - FileContents
    - FileDiff
    - FileNode
    - FileRef
    - FormField
    - GroupView
    - HostDetail
    - HostEntry
    - HostForm
    - IncludeReference
    - Overview
    - PendingTransaction
    - SavePreview
    - SaveResult
    - Source
