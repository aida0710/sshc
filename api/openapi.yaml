        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/trash/{entryId}/restore:
    post:
      operationId: restoreTrashEntry
      parameters:
        - name: entryId
          in: path
