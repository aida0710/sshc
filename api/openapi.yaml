    post:
      operationId: moveSFTPTransferJob
      description: Reorder one waiting job inside the queue. Running jobs keep their place.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransferQueueMoveRequest" } } } }
      responses:
        "200": { description: Queue reordered, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransferJobList" } } } }
