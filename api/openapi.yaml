        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/transfers/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
    post:
      operationId: updateSFTPTransferJob
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransferJobActionRequest" } } } }
      responses:
        "200": { description: Updated transfer job, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransferJob" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/transfers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
    delete:
      operationId: removeSFTPTransferJob
      description: Remove one completed, cancelled, or failed transfer from the engine-owned ledger. Failed uploads first clean their unpublished temporary file.
      responses:
        "204": { description: Transfer job removed, or it was already absent }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/transfers/{id}/download-checkpoint:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
    post:
      operationId: checkpointSFTPDownload
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPDownloadCheckpointRequest" } } } }
      responses:
        "200": { description: Durable download checkpoint accepted, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransferJob" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/uploads/{id}:
    parameters:
      - { name: alias, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
    post:
      operationId: startSFTPResumableUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPStartUploadRequest" } } } }
      responses:
        "200": { description: Upload initialized or resumed, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPResumableUpload" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: appendSFTPResumableUpload
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: offset, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: total, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: range, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: length, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, maximum: 4294967296 } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary, maxLength: 4294967296 } } } }
      responses:
        "200": { description: Chunk appended, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPResumableUpload" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: cancelSFTPResumableUpload
      parameters: [ { name: path, in: query, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Part file removed, content: { application/json: { schema: { $ref: "#/components/schemas/ChangedResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/uploads/{id}/complete:
    parameters:
      - { name: alias, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
    post:
      operationId: completeSFTPResumableUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPCompleteUploadRequest" } } } }
      responses:
        "201": { description: Part file atomically published, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTransfer" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/entry:
    parameters: *sftpAlias
    patch:
      operationId: renameSFTPEntry
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPRenameRequest" } } } }
      responses:
        "200": { description: Entry renamed, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPEntry" } } } }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSFTPEntry
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: X-SSHC-Action, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Entry deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ChangedResponse" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/mode:
    parameters: *sftpAlias
    patch:
      operationId: chmodSFTPEntry
      parameters:
        - { name: X-SSHC-Action, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPChmodRequest" } } } }
      responses:
        "200": { description: Entry permissions changed, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPEntry" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/workspaces:
    get:
      operationId: listTerminalWorkspaces
      responses:
        "200": { description: Device-local terminal workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }
    post:
      operationId: createTerminalWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceDefinition" } } } }
      responses:
        "201": { description: Workspace saved, content: { application/json: { schema: { $ref: "#/components/schemas/TerminalWorkspace" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/workspaces/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } } ]
    get:
      operationId: getTerminalWorkspace
      responses: { "200": { description: Saved workspace, content: { application/json: { schema: { $ref: "#/components/schemas/TerminalWorkspace" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    put:
      operationId: updateTerminalWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceDefinition" } } } }
      responses: { "200": { description: Updated workspace, content: { application/json: { schema: { $ref: "#/components/schemas/TerminalWorkspace" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteTerminalWorkspace
      responses: { "200": { description: Workspace deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ChangedResponse" } } } }, "404": { $ref: "#/components/responses/Problem" } }
  /api/v1/workspaces/{id}/restore:
    post:
      operationId: restoreTerminalWorkspace
      parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } } ]
      responses: { "200": { description: Layout and explicit reconnect plan, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceRestorePlan" } } } }, "404": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets:
    get:
      operationId: listSnippets
      responses: { "200": { description: Snippet library, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetLibrary" } } } } }
    post:
      operationId: createSnippet
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetDraft" } } } }
      responses: { "201": { description: Snippet created, content: { application/json: { schema: { $ref: "#/components/schemas/Snippet" } } } }, "400": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } } ]
    put:
      operationId: updateSnippet
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetDraft" } } } }
      responses: { "200": { description: Snippet updated, content: { application/json: { schema: { $ref: "#/components/schemas/Snippet" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteSnippet
      responses: { "200": { description: Snippet deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ChangedResponse" } } } }, "404": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets/startup/{alias}:
    put:
      operationId: setStartupSnippet
      parameters: [ { name: alias, in: path, required: true, schema: { type: string, maxLength: 255 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StartupSnippetRequest" } } } }
      responses: { "200": { description: Startup assignment updated, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetLibrary" } } } }, "400": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets/preview:
    post:
      operationId: previewSnippetExecution
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetPreviewRequest" } } } }
      responses: { "200": { description: Exact targets and commands plus one-time action token for a snippet or ad-hoc command, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetPreview" } } } }, "400": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets/jobs:
    post:
      operationId: executeSnippet
      parameters: [ { name: X-SSHC-Action, in: header, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetExecuteRequest" } } } }
      responses: { "202": { description: Execution job started, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetJob" } } } }, "403": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } }
  /api/v1/snippets/jobs/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } } ]
    get:
      operationId: getSnippetJob
      responses: { "200": { description: Per-host execution state, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetJob" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: cancelSnippetJob
      responses: { "202": { description: Cancellation requested, content: { application/json: { schema: { $ref: "#/components/schemas/SnippetJob" } } } }, "404": { $ref: "#/components/responses/Problem" } }
components:
  schemas:
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
        browserToken: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$" }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [ok], x-go-type: string }
        version: { type: string, minLength: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: string }
        path: { type: string }
        line: { type: integer }
        column: { type: integer }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        conflict: { $ref: "#/components/schemas/ConflictReport" }
        blockers: { type: array, items: { type: string } }
        currentVersion: { type: integer, minimum: 0 }
        requiredVersion: { type: integer, minimum: 1 }
        # blockers は拒否理由を安定したコードで返す。
    KeyReference:
      type: object
      additionalProperties: false
      required: [directive, configPath, line, condition, hostPatterns, value]
      properties:
        directive: { type: string }
        configPath: { type: string }
        line: { type: integer }
        condition: { type: string }
        hostPatterns: { type: array, items: { type: string } }
        value: { type: string }
    UnresolvedReference:
      type: object
      additionalProperties: false
      required: [directive, value, configPath, line, reason]
      properties:
        directive: { type: string }
        value: { type: string }
        configPath: { type: string }
        line: { type: integer }
        reason: { type: string }
    KeyCertificate:
      type: object
      additionalProperties: false
      required: [keyId, principals, validBefore, neverExpires, signedKeyType, signedKeyFingerprint]
      properties:
        keyId: { type: string }
        principals: { type: array, items: { type: string } }
        validBefore: { type: integer }
        neverExpires: { type: boolean }
        signedKeyType: { type: string }
        signedKeyFingerprint: { type: string }
    UnreadableFile:
      type: object
      additionalProperties: false
      required: [relativePath, reason]
      properties:
        relativePath: { type: string }
        reason: { type: string }
    KeyItem:
      type: object
      additionalProperties: false
      required:
        [id, relativePath, kind, container, algorithm, keyType, bits, encrypted,
         fingerprint, comment, permission, permissionRisk, sizeBytes, references, notes]
      properties:
        id: { type: string }
        relativePath: { type: string }
        kind: { type: string }
        container: { type: string }
        algorithm: { type: string }
        keyType: { type: string }
        bits: { type: integer }
        encrypted: { type: boolean }
        fingerprint: { type: string }
        comment: { type: string }
        permission: { type: string }
        permissionRisk: { type: boolean }
        sizeBytes: { type: integer }
        certificate: { $ref: "#/components/schemas/KeyCertificate" }
        references: { type: array, items: { $ref: "#/components/schemas/KeyReference" } }
        notes: { type: array, items: { type: string } }
    AgentIdentity:
      type: object
      additionalProperties: false
      required: [bits, fingerprint, comment, algorithm]
      properties:
        bits: { type: integer }
        fingerprint: { type: string }
        comment: { type: string }
        algorithm: { type: string }
    Credential:
      type: object
      additionalProperties: false
      required: [kind, name, uses, hosts]
      properties:
        kind: { type: string }
        name: { type: string }
        # この資格情報を指しているもの。パスワードなら alias、パスフレーズなら
        # 鍵のパスである。値そのものは決して含まない。
        uses: { type: array, items: { type: string } }
        # パスワードなら uses と同じ alias。パスフレーズなら、その鍵を
        # effective IdentityFile として使う、確認できた具体的な alias。
        hosts: { type: array, items: { type: string } }
    DedicatedKeyPassphraseUsage:
      type: object
      additionalProperties: false
      required: [key, hosts]
      properties:
        # 共有名を持たず、この鍵だけが所有する保存値。値は返さない。
        key: { type: string }
        hosts: { type: array, items: { type: string } }
    CredentialList:
      type: object
      additionalProperties: false
      required: [credentials, dedicatedKeyPassphrases, keyHostUsageComplete]
      properties:
        credentials: { type: array, items: { $ref: "#/components/schemas/Credential" } }
        dedicatedKeyPassphrases:
          type: array
          items: { $ref: "#/components/schemas/DedicatedKeyPassphraseUsage" }
        # false なら key_passphrase の hosts は空ではなく未確認。password の
        # hosts は vault の割り当てなので、この値に関わらず完全である。
        keyHostUsageComplete: { type: boolean }
    UpdateStatus:
      type: object
      additionalProperties: false
      required: [current, available]
      properties:
        current: { type: string }
        # 何かが公開されるまで、あるいは確認が走るまでは空。
        latest: { type: string }
        available: { type: boolean }
        # 何が変わったかをユーザーが読み、どうするかを決める場所。このアプリケーションは
        # 何も取得せず、何も置き換えない。
        pageUrl: { type: string }
    ChangeMasterPasswordRequest:
      type: object
      additionalProperties: false
      required: [current, next]
      properties:
        current: { type: string, minLength: 1, maxLength: 1024 }
        next: { type: string, minLength: 1, maxLength: 1024 }
    ResetUnsupportedVaultRequest:
      type: object
      additionalProperties: false
      required: [passphrase, acknowledged]
      properties:
        passphrase: { type: string, minLength: 1, maxLength: 1024 }
        acknowledged: { type: boolean }
    ChangeMasterPasswordResult:
      type: object
      additionalProperties: false
      required: [vault]
      properties:
        vault: { $ref: "#/components/schemas/PasswordVaultStatus" }
    StoreCredentialRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: { type: string, minLength: 1, maxLength: 1024 }
    UpdateCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        secret: { type: string, minLength: 1, maxLength: 1024 }
    RevealCredentialResponse:
      type: object
      additionalProperties: false
      required: [kind, name, secret]
      properties:
        kind: { type: string }
        name: { type: string }
        secret: { type: string }
    AssignCredentialRequest:
      type: object
      additionalProperties: false
      required: [subject, name]
      properties:
        subject: { type: string, minLength: 1, maxLength: 4096 }
        name: { type: string, minLength: 1, maxLength: 128 }
    AgentIdentitiesResponse:
      type: object
      additionalProperties: false
      required: [id, agentAvailable, identities]
      properties:
        id: { type: string }
        agentAvailable: { type: boolean }
        identities:
          type: array
          items: { $ref: "#/components/schemas/AgentIdentity" }
    KeyInventoryResponse:
      type: object
      additionalProperties: false
      required: [items, unreadable, agentDelegations, unresolvedReferences, agentAvailable, agentIdentities]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/KeyItem" } }
        unreadable: { type: array, items: { $ref: "#/components/schemas/UnreadableFile" } }
        agentDelegations: { type: array, items: { $ref: "#/components/schemas/KeyReference" } }
        unresolvedReferences: { type: array, items: { $ref: "#/components/schemas/UnresolvedReference" } }
        agentAvailable: { type: boolean }
        agentIdentities: { type: array, items: { $ref: "#/components/schemas/AgentIdentity" } }
    KeyVariant:
      type: object
      additionalProperties: false
      required: [algorithm, bits, label, inProcess, reason]
      properties:
        algorithm: { type: string }
        bits: { type: integer }
        label: { type: string }
        inProcess: { type: boolean }
        reason: { type: string }
    KeyAlgorithmsResponse:
      type: object
      additionalProperties: false
      # diagnostic は無い。尋ねる相手がいなくなったので、尋ねられなかったと
      # 報告することも無い。
      required: [variants, source]
      properties:
        variants: { type: array, items: { $ref: "#/components/schemas/KeyVariant" } }
        source: { type: string }
    GenerateKeyRequest:
      type: object
      additionalProperties: false
      required: [algorithm, fileName, comment, passphrase, unencrypted]
      properties:
        algorithm: { type: string, minLength: 1, maxLength: 16 }
        bits: { type: integer }
        fileName: { type: string, minLength: 1, maxLength: 64 }
        group: { type: string, maxLength: 400 }
        comment: { type: string, maxLength: 127 }
        passphrase: { type: string, maxLength: 1024 }
        unencrypted: { type: boolean }
    GenerateKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, publicRelativePath, fingerprint, keyType, bits, encrypted, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        publicRelativePath: { type: string }
        fingerprint: { type: string }
        keyType: { type: string }
        bits: { type: integer }
        encrypted: { type: boolean }
        transactionId: { type: string }
    HardwareCommandRequest:
      type: object
      additionalProperties: false
      required: [algorithm, fileName, comment]
      properties:
        group: { type: string, maxLength: 400 }
        algorithm: { type: string, minLength: 1, maxLength: 16 }
        fileName: { type: string, minLength: 1, maxLength: 64 }
        comment: { type: string, maxLength: 127 }
    HardwareCommandResponse:
      type: object
      additionalProperties: false
      required: [algorithm, command, note]
      properties:
        algorithm: { type: string }
        command: { type: array, items: { type: string } }
        note: { type: string }
    ChangePassphraseRequest:
      type: object
      additionalProperties: false
      required: [currentPassphrase, newPassphrase, unencrypted]
      properties:
        currentPassphrase: { type: string, maxLength: 1024 }
        newPassphrase: { type: string, maxLength: 1024 }
        unencrypted: { type: boolean }
    ChangePassphraseResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, encrypted, notes, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        encrypted: { type: boolean }
        notes: { type: array, items: { type: string } }
        transactionId: { type: string }
    RevealPrivateKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, privateKey, encrypted, fingerprint, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        privateKey: { type: string }
        encrypted: { type: boolean }
        fingerprint: { type: string }
        transactionId: { type: string }
    AliasRequest:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias: { type: string, minLength: 1, maxLength: 255 }
    ExecutableDirective:
      type: object
      additionalProperties: false
      required: [keyword, command, path, line, condition, onEvaluate, onConnect, overridable]
      properties:
        keyword: { type: string }
        command: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        onEvaluate: { type: boolean }
        onConnect: { type: boolean }
        overridable: { type: boolean }
    ConfigCheckResponse:
      type: object
      additionalProperties: false
      required: [root, files, diagnostics]
      properties:
        root: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/ConfigFileSummary" }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/ConfigDiagnostic" }
    ConfigFileSummary:
      type: object
      additionalProperties: false
      required: [path, editable, missing, loads, includes]
      properties:
        path: { type: string }
        editable: { type: boolean }
        missing: { type: boolean }
        loads: { type: integer }
        includes: { type: integer }
    ConfigDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, path, line, detail]
      properties:
        severity: { type: string }
        code: { type: string }
        path: { type: string }
        line: { type: integer }
        detail: { type: string }
    EffectiveResponse:
      type: object
      additionalProperties: false
      required: [alias, tokenWarning, executableDirectives, sources, complexities, route]
      properties:
        alias: { type: string }
        tokenWarning: { type: string }
        executableDirectives:
          type: array
          items: { $ref: "#/components/schemas/ExecutableDirective" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ValueSource" }
        complexities:
          type: array
          items: { $ref: "#/components/schemas/ComplexityNote" }
        route:
          type: array
          items: { $ref: "#/components/schemas/JumpStage" }
    ValueSource:
      type: object
      additionalProperties: false
      required: [keyword, value, path, line, condition, kind, winner]
      properties:
        keyword: { type: string }
        value: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        kind: { type: string }
        winner: { type: boolean }
    ComplexityNote:
      type: object
      additionalProperties: false
      required: [code, path, line, condition, detail]
      properties:
        code: { type: string }
        path: { type: string }
        line: { type: integer }
        condition: { type: string }
        detail: { type: string }
    JumpStage:
      type: object
      additionalProperties: false
      required: [order, depth, parent, hop, hostname, user, port, complex]
      properties:
        order: { type: integer }
        depth: { type: integer }
        parent: { type: string }
        hop: { type: string }
        hostname: { type: string }
        user: { type: string }
        port: { type: string }
        complex: { type: boolean }
    ReachabilityResponse:
      type: object
      additionalProperties: false
      required: [address, outcome, elapsedMs, detail, notice]
      properties:
        address: { type: string }
        outcome: { type: string }
        elapsedMs: { type: integer }
        detail: { type: string }
        notice: { type: string }
    AuthenticationRequest:
      type: object
      additionalProperties: false
      required: [alias, acknowledgeExecutable]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        acknowledgeExecutable: { type: boolean }
    AuthenticationResponse:
      type: object
      additionalProperties: false
      # exitCode と stderr は無い。外部の ssh を起動しないので、終了コードも
      # 診断出力も存在しない。代わりに method（通った認証方式）と detail
      # （ユーザーへ向けた説明）を返す。
      required: [outcome, authenticated, method, detail, truncated, elapsedMs]
      properties:
        outcome: { type: string }
        authenticated: { type: boolean }
        method: { type: string }
        detail: { type: string }
        truncated: { type: boolean }
        elapsedMs: { type: integer }
    RemoteKeyPlanRequest:
      type: object
      additionalProperties: false
      required: [alias, keyPath, publicKey]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        keyPath: { type: string, maxLength: 4096 }
        publicKey: { type: string, minLength: 1, maxLength: 4096 }
    RemoteKeyPlan:
      type: object
      additionalProperties: false
      required: [alias, user, hostname, port, valuesFrom, fingerprint, keyPath, keyLine, remotePath, routine, supported, manual, executableDirectives, actionToken, actionExpiresAt]
      properties:
        alias: { type: string }
        user: { type: string }
        hostname: { type: string }
        port: { type: string }
        valuesFrom: { type: string }
        fingerprint: { type: string }
        keyPath: { type: string }
        keyLine: { type: string }
        remotePath: { type: string }
        routine: { type: string }
        supported: { type: boolean }
        manual:
          type: array
          items: { type: string }
        executableDirectives:
          type: array
          items: { $ref: "#/components/schemas/ExecutableDirective" }
        actionToken: { type: string }
        actionExpiresAt: { type: string }
    RemoteKeyRegisterRequest:
      type: object
      additionalProperties: false
      required: [alias, keyPath, publicKey, acknowledgeExecutable]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        keyPath: { type: string, maxLength: 4096 }
        publicKey: { type: string, minLength: 1, maxLength: 4096 }
        acknowledgeExecutable: { type: boolean }
    RemoteKeyRegisterResponse:
      type: object
      additionalProperties: false
      required: [outcome, exitCode, stderr, truncated]
      properties:
        outcome: { type: string }
        exitCode: { type: integer }
        stderr: { type: string }
        truncated: { type: boolean }
    KnownHostsResponse:
      type: object
      additionalProperties: false
      required: [path, entries]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/KnownHostEntry" }
    KnownHostEntry:
      type: object
      additionalProperties: false
      required: [line, digest, marker, hosts, hashed, keyType, fingerprint, comment]
      properties:
        line: { type: integer }
        digest: { type: string }
        marker: { type: string }
        hosts:
          type: array
          items: { type: string }
        hashed: { type: boolean }
        keyType: { type: string }
        fingerprint: { type: string }
        comment: { type: string }
    KnownHostTarget:
      type: object
      additionalProperties: false
      required: [line, digest]
      properties:
        line: { type: integer }
        digest: { type: string, minLength: 64, maxLength: 64 }
    KnownHostsDeleteRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/KnownHostTarget" }
    KnownHostsChangeResponse:
      type: object
      additionalProperties: false
      required: [changed, transactionId]
      properties:
        changed: { type: boolean }
        transactionId: { type: string }
    KnownHostsScanRequest:
      type: object
      additionalProperties: false
      required: [host, port]
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer }
    KnownHostsScanResponse:
      type: object
      additionalProperties: false
      required: [notice, candidates]
      properties:
        notice: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/KnownHostCandidate" }
    KnownHostCandidate:
      type: object
      additionalProperties: false
      required: [host, port, keyType, key, fingerprint, verified]
      properties:
        host: { type: string }
        port: { type: integer }
        keyType: { type: string }
        key: { type: string }
        fingerprint: { type: string }
        verified: { type: boolean }
    KnownHostsAddRequest:
      type: object
      additionalProperties: false
      required: [host, port, keyType, key, expectedFingerprint, acknowledged]
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer }
        keyType: { type: string, minLength: 1, maxLength: 64 }
        key: { type: string, minLength: 1, maxLength: 4096 }
        expectedFingerprint: { type: string, maxLength: 128 }
        acknowledged: { type: boolean }
    # 開いている端末セッションひとつ。この一覧にはスクロールバックを含めない。
    # 画面描画用のraw bytesはWebSocketだけが運び、control APIはescape sequenceを
    # 除いたbounded plain textをautomation向けに別契約で返す。
    TerminalForward:
      type: object
      additionalProperties: false
      required: [id, kind, listen, to, problem, temporary]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, pattern: "^(local|dynamic|agent)$" }
        listen: { type: string }
        to: { type: string }
        problem: { type: string }
        temporary: { type: boolean }
    StartTerminalForwardRequest:
      type: object
      additionalProperties: false
      required: [kind, listenPort]
      properties:
        kind: { type: string, pattern: "^(local|dynamic)$" }
        listenPort: { type: integer, minimum: 1, maximum: 65535 }
        destination: { type: string, maxLength: 512 }
    TerminalSession:
      type: object
      additionalProperties: false
      required: [id, kind, title, startedAt, state, problem]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ssh, shell] }
        # alias を持つのは kind が ssh のときだけである。localhost はローカル
        # シェルであって ssh 接続ではないので、alias を持たない。
        alias: { type: string }
        title: { type: string }
        startedAt: { type: string }
        # SSH process の状態。browser と WebSocket の link 状態は含まない。
        state: { type: string, enum: [connecting, connected, reconnecting, exited] }
        # 画面が翻訳する固定コード。raw transport error は返さない。
        problem: { type: string }
        reconnect: { $ref: "#/components/schemas/TerminalReconnect" }
        progress: { $ref: "#/components/schemas/TerminalConnectionProgress" }
        exited: { $ref: "#/components/schemas/TerminalExit" }
        # 現在開いている転送。
        forwards: { type: array, items: { $ref: "#/components/schemas/TerminalForward" } }
        presentation: { $ref: "#/components/schemas/TerminalPresentation" }
        agent: { $ref: "#/components/schemas/TerminalAgent" }
    TerminalPresentation:
      type: object
      additionalProperties: false
      required: [displayTitle, titleSource, titlePinned]
      properties:
        displayTitle: { type: string }
        titleSource: { type: string, enum: [user, agent, candidate, connection, fallback] }
        titlePinned: { type: boolean }
    TerminalAgent:
      type: object
      additionalProperties: false
      required: [kind, state, resumable, observationVersion, signalVersion]
      properties:
        kind: { type: string, enum: [claude, codex, opencode] }
        state: { type: string, enum: [working, attention, ready, unknown] }
        cwd: { type: string }
        model: { type: string }
        sessionName: { type: string }
        resumable: { type: boolean }
        observationVersion: { type: integer, minimum: 0 }
        signalVersion: { type: integer, minimum: 0 }
        lastSignal: { $ref: "#/components/schemas/TerminalAgentSignal" }
    TerminalAgentSignal:
      type: object
      additionalProperties: false
      required: [kind, occurredAt]
      properties:
        kind: { type: string, enum: [attention, completed] }
        occurredAt: { type: string, format: date-time }
    TerminalConnectionProgress:
      type: object
      additionalProperties: false
      x-sshc-less-than-or-equal:
        - [hop, hops]
      required: [phase, alias, hostName, user, hop, hops]
      properties:
        phase:
          type: string
          enum: [dialing, host_key, authenticating, authenticated, opening_session]
        alias: { type: string }
        hostName: { type: string }
        user: { type: string }
        hop: { type: integer, minimum: 1 }
        hops: { type: integer, minimum: 1 }
    TerminalReconnect:
      type: object
      additionalProperties: false
      x-sshc-less-than-or-equal:
        - [attempt, limit]
      required: [attempt, limit, retryAt, problem]
      properties:
        attempt: { type: integer, minimum: 1, maximum: 5 }
        limit: { type: integer, minimum: 1, maximum: 5 }
        retryAt: { type: string, format: date-time }
        problem: { type: string }
    TerminalExit:
      type: object
      additionalProperties: false
      required: [code, signal, at]
      properties:
        code: { type: integer }
        signal: { type: string }
        at: { type: string }
    TerminalSessionList:
      type: object
      additionalProperties: false
      required: [sessions, maxSessions]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/TerminalSession" } }
        maxSessions: { type: integer, minimum: 0, maximum: 200 }
    TerminalControlCursor:
      type: object
      additionalProperties: false
      required: [requested, start, next, end, truncated]
      properties:
        requested: { type: integer, format: uint64, minimum: 0 }
        start: { type: integer, format: uint64, minimum: 0 }
        next: { type: integer, format: uint64, minimum: 0 }
        end:
          type: integer
          format: uint64
          minimum: 0
          description: Monotonic end of the raw transcript; greater than next means unread bytes remain.
        truncated: { type: boolean }
    TerminalControlResponse:
      type: object
      additionalProperties: false
      required: [session, generation, state, cursor, output]
      properties:
        session: { $ref: "#/components/schemas/TerminalSession" }
        generation: { type: integer, format: uint64, minimum: 1 }
        state:
          type: string
          enum: [connecting, connected, reconnecting, exited, agent-working, agent-attention, agent-ready, agent-ended]
        cursor: { $ref: "#/components/schemas/TerminalControlCursor" }
        output:
          type: string
          description: Bounded transcript with terminal escape and control sequences removed.
    OpenTerminalSessionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [ssh, shell] }
        alias: { type: string, minLength: 1, maxLength: 255 }
        # ssh kind only. An absolute POSIX directory selected by the SFTP UI.
        cwd: { type: string, minLength: 1, maxLength: 4096 }
        cols: { type: integer }
        rows: { type: integer }
        # shell kind only. Must match one of LocalShellProfileList; executable
        # paths and command strings are never accepted from the caller.
        profileId: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
    LocalShellProfile:
      type: object
      additionalProperties: false
      required: [id, label, path, arguments, default]
      properties:
        id: { type: string }
        label: { type: string }
        path: { type: string }
        arguments: { type: array, items: { type: string } }
        default: { type: boolean }
    LocalShellProfileList:
      type: object
      additionalProperties: false
      required: [profiles]
      properties:
        profiles: { type: array, items: { $ref: "#/components/schemas/LocalShellProfile" } }
    # 名前は一覧の表示だけのものである。走っているプロセスにも ssh の相手にも
    # 触れず、metadata へも書かない。セッションと一緒に消える。
    RenameTerminalSessionRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 64 }
    SetTerminalSessionTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
    ResumeTerminalAgentRequest:
      type: object
      additionalProperties: false
      required: [observationVersion, placement]
      properties:
        observationVersion: { type: integer, minimum: 1 }
        placement: { type: string, enum: [same-pane, new-pane] }
    # streamTicket は使い捨てで、このセッション ID に束縛され、10 秒で失効する。
    # ブラウザは WebSocket のハンドシェイクにカスタムヘッダを付けられないので、
    # これがそのアップグレードを認可する唯一のものである。
    TerminalStreamTicket:
      type: object
      additionalProperties: false
      required: [streamTicket]
      properties:
        streamTicket: { type: string }
    TerminalCommandTargetRequest:
      type: object
      additionalProperties: false
      required: [targetId, sessionId]
      properties:
        targetId: { type: string, minLength: 1, maxLength: 255 }
        sessionId: { type: string, minLength: 1, maxLength: 64 }
    TerminalCommandPreviewRequest:
      type: object
      additionalProperties: false
      required: [inputs, targets]
      properties:
        snippetId: { type: string }
        command: { type: string, minLength: 1, maxLength: 4095 }
        revealCommand:
          type: boolean
          description: Return the expanded command for an explicit insert, run, or copy action. Normal previews remain redacted.
        issueAction:
          type: boolean
          description: Issue a one-time execution token. Defaults to true for compatibility; passive previews should set false.
        submit:
          type: boolean
          description: Bind the preview to sending Enter after the command. Defaults to true.
        expectedReviewEvidence:
          type: string
          minLength: 64
          maxLength: 64
          description: Refuse to issue an action if the redacted command or exact target changed since the displayed passive preview.
        inputs:
          type: object
          additionalProperties: { type: string }
        targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/TerminalCommandTargetRequest" }
    TerminalCommandDispatchRequest:
      type: object
      additionalProperties: false
      required: [inputs, targets, evidence]
      properties:
        snippetId: { type: string }
        command: { type: string, minLength: 1, maxLength: 4095 }
        submit:
          type: boolean
          description: Send Enter after the command. Defaults to true.
        inputs:
          type: object
          additionalProperties: { type: string }
        targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/TerminalCommandTargetRequest" }
        evidence: { type: string, minLength: 64, maxLength: 64 }
    TerminalCommandPreviewTarget:
      type: object
      additionalProperties: false
      required: [targetId, sessionId, alias, title, command]
      properties:
        targetId: { type: string }
        sessionId: { type: string }
        alias: { type: string }
        title: { type: string }
        command: { type: string }
    TerminalCommandPreview:
      type: object
      additionalProperties: false
      required: [snippetId, evidence, reviewEvidence, actionToken, actionExpiresAt, targets]
      properties:
        snippetId: { type: string }
        evidence: { type: string }
        reviewEvidence:
          type: string
          description: Stable evidence for the displayed redacted command and exact targets, independent of whether Enter will be sent.
        actionToken: { type: string }
        actionExpiresAt: { type: string }
        targets:
          type: array
          items: { $ref: "#/components/schemas/TerminalCommandPreviewTarget" }
    TerminalCommandResult:
      type: object
      additionalProperties: false
      required: [targetId, sessionId, alias, title, status]
      properties:
        targetId: { type: string }
        sessionId: { type: string }
        alias: { type: string }
        title: { type: string }
        status: { type: string, enum: [delivered, failed] }
        problem: { type: string }
    TerminalCommandDispatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TerminalCommandResult" }
    OpenTerminalSessionResponse:
      type: object
      additionalProperties: false
      required: [session, streamTicket]
      properties:
        session: { $ref: "#/components/schemas/TerminalSession" }
        streamTicket: { type: string }
    # このマシンがどちら向きにデータを動かしてよいか。支配するのは書き込みだけで、
    # それ以外は何も支配しない。"push" はこのディスクへのスナップショット適用を
    # 拒否し、"pull" はバケットへの書き込みを拒否する。プレビューは読むだけで何も
    # 書かないので、どちらでも利用でき、適用してはいけないマシンでも、どれだけ
    # 遅れているかは見ることができる。
    SyncDirection:
      type: string
      enum: [both, push, pull]
    SyncStatus:
      type: object
      additionalProperties: false
      required: [configured, locked, endpoint, bucket, synced, direction, keyConfigured, auto]
      properties:
        configured: { type: boolean }
        # 同期鍵の設定有無。鍵の値は返さない。
        keyConfigured: { type: boolean }
        # Access Key IDそのものは返さず、再設定時に利用者が対象を見分けるための
        # 末尾5文字だけを返す。secret access keyは一部であっても返さない。
        accessKeySuffix: { type: string, maxLength: 5 }
        # 自動同期。衝突や削除を伴う適用は phase=blocked で停止する。
        auto: { $ref: "#/components/schemas/AutoSync" }
        # フォームが空のとき、その理由。設定はマスターパスワードで暗号化されており、
        # それが与えられるまで読めない。Access Key IDの識別用末尾以外やsecretは含めない。
        locked: { type: boolean }
        # エンドポイント・バケット・リージョンは、これが何を指しているかをユーザーが
        # 見られるよう返す。Access Key IDの識別用末尾以外と秘密が返ることは決してない。
        endpoint: { type: string }
        bucket: { type: string }
        # 署名スコープに入る値。R2 では "auto"、本物の AWS ではバケットのリージョン
        # なので、画面がこれを出せないと、利用者は自分が何を設定したのか確かめられない。
        region: { type: string }
        # すべてのオブジェクトが置かれる接頭辞。空ならバケットのルート。
        path: { type: string }
        synced: { type: boolean }
        direction: { $ref: "#/components/schemas/SyncDirection" }
        lastSyncedAt: { type: string }
        origin: { type: string }
        fileCount: { type: integer }
        # push または apply の最後の成功だけを保持する。preview と失敗はここを
        # 上書きしないため、新しい失敗と以前の成功を画面で別々に説明できる。
        lastOperation: { $ref: "#/components/schemas/SyncOperation" }
    SnapshotSummary:
      type: object
      additionalProperties: false
      required: [createdAt, fileCount, sourceBytes, snapshotBytes]
      properties:
        createdAt: { type: string }
        fileCount: { type: integer, minimum: 0 }
        # 利用者が管理しているファイル内容の合計。tar header と manifest は含まない。
        sourceBytes: { type: integer, format: int64, minimum: 0 }
        # オブジェクトストアが保持する暗号化済みスナップショット一個の大きさ。
        snapshotBytes: { type: integer, format: int64, minimum: 0 }
    SyncOperationKind:
      type: string
      enum: [push, apply]
    PushResult:
      type: object
      additionalProperties: false
      required: [summary, objectCount, uploadedBytes, completedAt]
      properties:
        summary: { $ref: "#/components/schemas/SnapshotSummary" }
        objectCount: { type: integer, minimum: 0 }
        # 日付付きコピーとライブオブジェクトへの各 PUT body の合計。
        uploadedBytes: { type: integer, format: int64, minimum: 0 }
        completedAt: { type: string }
    PushResponse:
      type: object
      additionalProperties: false
      required: [status, result]
      properties:
        status: { $ref: "#/components/schemas/SyncStatus" }
        result: { $ref: "#/components/schemas/PushResult" }
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 240 }
    SyncPushDraft:
      type: object
      additionalProperties: false
      required: [message, added, modified, removed]
      properties:
        message: { type: string, minLength: 1, maxLength: 240 }
        added: { type: integer, minimum: 0, maximum: 4096 }
        modified: { type: integer, minimum: 0, maximum: 4096 }
        removed: { type: integer, minimum: 0, maximum: 4096 }
    SyncExclusionCandidate:
      type: object
      additionalProperties: false
      required: [path, ignored]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        ignored: { type: boolean }
    SyncExclusions:
      type: object
      additionalProperties: false
      required: [document, usingDefaults, candidates]
      properties:
        document: { type: string, maxLength: 32768 }
        usingDefaults: { type: boolean }
        candidates:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/SyncExclusionCandidate" }
    SyncExclusionsRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { type: string, maxLength: 32768 }
    SyncBucketObject:
      type: object
      additionalProperties: false
      required: [key, size]
      properties:
        key: { type: string, minLength: 1 }
        size: { type: integer, format: int64, minimum: 0 }
        lastModified: { type: string }
    SyncBucketStatus:
      type: object
      additionalProperties: false
      required: [checkedAt, localIsLive, history, historyTruncated]
      properties:
        checkedAt: { type: string }
        localIsLive: { type: boolean }
        live: { $ref: "#/components/schemas/SyncBucketObject" }
        history:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/SyncBucketObject" }
        historyTruncated: { type: boolean }
    SyncHistoryRelation:
      type: string
      enum: [head, ancestor, branch]
    SyncHistoryRevision:
      type: object
      additionalProperties: false
      required: [key, revision, message, createdAt, origin, fileCount, size, relation]
      properties:
        key: { type: string, minLength: 1, maxLength: 1024 }
        revision: { type: string, pattern: "^[0-9a-f]{64}$" }
        parentRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        message: { type: string, minLength: 1, maxLength: 240 }
        createdAt: { type: string }
        # hostnameではなく、manifest内のopaque installation ID。
        origin: { type: string }
        fileCount: { type: integer, minimum: 0, maximum: 4096 }
        size: { type: integer, format: int64, minimum: 0 }
        lastModified: { type: string }
        relation: { $ref: "#/components/schemas/SyncHistoryRelation" }
    SyncHistory:
      type: object
      additionalProperties: false
      required: [checkedAt, headRevision, revisions, historyTruncated, downloadTruncated, downloadedBytes, skipped]
      properties:
        checkedAt: { type: string }
        headRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        revisions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SyncHistoryRevision" }
        historyTruncated: { type: boolean }
        downloadTruncated: { type: boolean }
        downloadedBytes: { type: integer, format: int64, minimum: 0, maximum: 134217728 }
        # 現行schemaで開けないimmutable history objectの数。live head自体が
        # 開けない場合は、この応答を成功させず通常どおりエラーにする。
        skipped: { type: integer, minimum: 0, maximum: 50 }
    SyncHistoryDiffRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 1024 }
    SyncHistoryDiff:
      type: object
      additionalProperties: false
      required: [fromRevision, toRevision, added, modified, removed, downloadedBytes]
      properties:
        fromRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        toRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
        added:
          type: array
          items: { type: string }
        modified:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        downloadedBytes: { type: integer, format: int64, minimum: 0 }
    SyncOperation:
      type: object
      additionalProperties: false
      required: [kind, summary, completedAt]
      properties:
        kind: { $ref: "#/components/schemas/SyncOperationKind" }
        summary: { $ref: "#/components/schemas/SnapshotSummary" }
        objectCount: { type: integer, minimum: 0 }
        uploadedBytes: { type: integer, format: int64, minimum: 0 }
        downloadedBytes: { type: integer, format: int64, minimum: 0 }
        written: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        completedAt: { type: string }
    SyncSettingsRequest:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, accessKeyId, secretAccessKey, direction]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        bucket: { type: string, minLength: 1, maxLength: 255 }
        # バケット内のどこにオブジェクトを置くか。既定の空はそのルートを指す。
        # バケットはたいていすでにこのアプリケーションにちなんで名付けられており、
        # その中で同じ名前を繰り返すフォルダは、何もない階層をひとつ増やすだけだ。
        path: { type: string, maxLength: 255 }
        region: { type: string, maxLength: 64 }
        accessKeyId: { type: string, minLength: 1, maxLength: 512 }
        secretAccessKey: { type: string, minLength: 1, maxLength: 512 }
        direction: { $ref: "#/components/schemas/SyncDirection" }
    SyncSetupTargetState:
      type: string
      enum: [empty, existing, incomplete]
    SyncSetupCheckRequest:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, reuseCredentials]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        bucket: { type: string, minLength: 1, maxLength: 255 }
        path: { type: string, maxLength: 255 }
        region: { type: string, maxLength: 64 }
        accessKeyId: { type: string, minLength: 1, maxLength: 512 }
        secretAccessKey: { type: string, minLength: 1, maxLength: 512 }
        # trueの場合はengine内の既存資格情報を再利用し、秘密値をクライアントへ返さない。
        reuseCredentials: { type: boolean }
    SyncSetupCheckResponse:
      type: object
      additionalProperties: false
      required: [state, historyPresent, checkedAt]
      properties:
        state: { $ref: "#/components/schemas/SyncSetupTargetState" }
        historyPresent: { type: boolean }
        checkedAt: { type: string }
        etag: { type: string, minLength: 1, maxLength: 1024 }
    SyncSetupRequest:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, direction, expectedState, historyPresent, key, reuseCredentials, reuseKey]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        bucket: { type: string, minLength: 1, maxLength: 255 }
        path: { type: string, maxLength: 255 }
        region: { type: string, maxLength: 64 }
        accessKeyId: { type: string, minLength: 1, maxLength: 512 }
        secretAccessKey: { type: string, minLength: 1, maxLength: 512 }
        reuseCredentials: { type: boolean }
        direction: { $ref: "#/components/schemas/SyncDirection" }
        expectedState: { $ref: "#/components/schemas/SyncSetupTargetState" }
        expectedETag: { type: string, minLength: 1, maxLength: 1024 }
        historyPresent: { type: boolean }
        # Empty requests generate a key when this is empty. Existing targets require it.
        key: { type: string, maxLength: 1024 }
        # Existing targetでtrueの場合、Vaultに保存済みの同期鍵を再利用する。
        reuseKey: { type: boolean }
    SyncSetupResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/SyncStatus" }
        # Returned once only when the server generated the key.
        generatedKey: { type: string, minLength: 1 }
    AutoSync:
      type: object
      additionalProperties: false
      required: [enabled, phase]
      properties:
        enabled: { type: boolean }
        phase: { type: string, enum: [idle, running, blocked, failed] }
        # blocked と failed の理由を表す安定コード。エラー文や URL は含めない。
        detail: { type: string }
        at: { type: string }
    AutoSyncRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SyncKeyRequest:
      type: object
      additionalProperties: false
      properties:
        # 省略時は安全な値を生成する。端末間で共有するため、利用者が保管する。
        key: { type: string, minLength: 1, maxLength: 1024 }
        # 既存鍵の置換では過去のimmutable historyは旧鍵のまま残り、以後読めない。
        # 初回設定には不要。破壊的な結果を理解した明示確認として扱う。
        confirmHistoryLoss: { type: boolean }
    SyncKeyResponse:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        # 平文でこれが出る唯一の場所である。画面はこれを一度だけ見せる。
        key: { type: string }
    PullRequest:
      type: object
      additionalProperties: false
      properties:
        # pull は既定でプレビューする。適用は二度目の意図的な呼び出しである。
        # これにより、このアプリケーションが他のあらゆる書き込みの前に見せる
        # ファイル単位のプレビューを、ユーザーはここでも見る。
        apply: { type: boolean }
        # 両側で変更されたファイルの採用元。省略時は衝突を報告して停止する。
        resolve: { type: string, enum: [local, remote] }
        # 受信可能なマシンで、既知の履歴につながらないlive headを利用者が
        # 明示的に確認して受け取る。resolve=remoteかつhistoryKeyなしの場合だけ有効。
        # apply時は通常pullと同じく直前のETagとrevisionを必須とする。
        acceptRemoteHead: { type: boolean }
        # 省略時はlive head。指定時はconfigured snapshots/配下のimmutable historyを
        # preview／applyする。remote head自体はこの操作では巻き戻さない。
        historyKey: { type: string, minLength: 1, maxLength: 1024 }
        # apply時は直前のpreviewが返した値を必須とする。二つのrequestの間に
        # live headが変わった場合、別世代を黙って適用せず409で再previewを促す。
        expectedETag: { type: string, maxLength: 1024 }
        expectedRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
    SyncConflict:
      type: object
      additionalProperties: false
      required: [path, changedHere, changedThere]
      properties:
        path: { type: string }
        changedHere: { type: boolean }
        changedThere: { type: boolean }
        baseMode: { type: string, pattern: "^0[67]00$" }
        localMode: { type: string, pattern: "^0[67]00$" }
        remoteMode: { type: string, pattern: "^0[67]00$" }
    PullResponse:
      type: object
      additionalProperties: false
      required: [applied, conflicts, written, removed, summary, downloadedBytes, completedAt, remoteETag, remoteRevision]
      properties:
        applied: { type: boolean }
        summary: { $ref: "#/components/schemas/SnapshotSummary" }
        # この一回の GET で受け取った暗号化オブジェクトの byte 数。preview と
        # apply は別々に取得するため、それぞれの応答が自分の転送量を返す。
        downloadedBytes: { type: integer, format: int64, minimum: 0 }
        completedAt: { type: string }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/SyncConflict" }
        # パスのみ。内容を運ぶ pull のレスポンスは、秘密鍵をレスポンス本文に
        # 置くことになる。
        written:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        origin: { type: string }
        remoteETag: { type: string }
        remoteRevision: { type: string, pattern: "^[0-9a-f]{64}$" }
    PasswordVaultStatus:
      type: object
      additionalProperties: false
      required: [exists, unlocked, aliases, dedicatedKeyPassphrases]
      properties:
        exists: { type: boolean }
        unlocked: { type: boolean }
        # パスワードが保存されているホスト。名前の集合は秘密ではない。秘密なのは
        # 値の方であり、どの操作もそれを返さない。
        aliases:
          type: array
          items: { type: string }
        # 鍵専用の保存値がある workspace-relative path。値そのものは、どの
        # レスポンスにも決して含めない。
        dedicatedKeyPassphrases:
          type: array
          items: { type: string }
        minPassphraseLength: { type: integer }
        # 直前の明示的なunlockで自動migrationを行った場合だけ返す。
        migratedFromVersion: { type: integer }
        migratedToVersion: { type: integer }
    # blocker は保存済みパスワードを使用不能にするので、保存自体を拒否する。
    # warning は利用者が確認すべき状態を示すが、保存を禁止しない。
    PasswordEligibility:
      type: object
      additionalProperties: false
      required: [alias, storable, blockers, warnings]
      properties:
        alias: { type: string }
        storable: { type: boolean }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        hostName: { type: string }
        port: { type: string }
    PassphraseRequest:
      type: object
      additionalProperties: false
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 1, maxLength: 1024 }
    StorePasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    IssueActionRequest:
      type: object
      additionalProperties: false
      required: [kind, target]
      properties:
        kind: { type: string, minLength: 1, maxLength: 64 }
        target: { type: string, minLength: 1, maxLength: 128 }
    IssueActionResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
        expiresAt: { type: string, minLength: 1 }
    PublicKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, publicKey, fingerprint, comment]
      properties:
        id: { type: string }
        relativePath: { type: string }
        publicKey: { type: string }
        fingerprint: { type: string }
        comment: { type: string }
    GroupRenameRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, minLength: 1, maxLength: 400 }
        to: { type: string, minLength: 1, maxLength: 400 }
    GroupDeleteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 400 }
        destination: { type: string, maxLength: 400 }
    CreateConnectionRequest:
      type: object
      additionalProperties: false
      required: [alias, hostName, authentication]
      properties:
        alias: { type: string, minLength: 1, maxLength: 64 }
        group: { type: string, maxLength: 400 }
        hostName: { type: string, minLength: 1, maxLength: 255 }
        user: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        authentication: { $ref: "#/components/schemas/CreateConnectionAuthentication" }
    CreateConnectionAuthentication:
      # TypeScript keeps the discriminated union below. Go receives the raw
      # branch and decodes it strictly at the HTTP boundary; this avoids the
      # optional oapi-codegen runtime dependency while still rejecting unknown
      # fields in the selected branch.
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/CreateDedicatedPasswordAuthentication"
        - $ref: "#/components/schemas/CreateSavedPasswordAuthentication"
        - $ref: "#/components/schemas/CreateNewSharedPasswordAuthentication"
        - $ref: "#/components/schemas/CreateIdentityFileAuthentication"
      discriminator:
        propertyName: kind
        mapping:
          dedicated_password: "#/components/schemas/CreateDedicatedPasswordAuthentication"
          saved_password: "#/components/schemas/CreateSavedPasswordAuthentication"
          new_shared_password: "#/components/schemas/CreateNewSharedPasswordAuthentication"
          identity_file: "#/components/schemas/CreateIdentityFileAuthentication"
    CreateDedicatedPasswordAuthentication:
      type: object
      additionalProperties: false
      required: [kind, password]
      properties:
        kind: { type: string, enum: [dedicated_password], x-go-type: string }
        password: { type: string, minLength: 1, maxLength: 1024 }
    CreateSavedPasswordAuthentication:
      type: object
      additionalProperties: false
      required: [kind, credential]
      properties:
        kind: { type: string, enum: [saved_password], x-go-type: string }
        credential: { type: string, minLength: 1, maxLength: 128 }
    CreateNewSharedPasswordAuthentication:
      type: object
      additionalProperties: false
      required: [kind, credential, password]
      properties:
        kind: { type: string, enum: [new_shared_password], x-go-type: string }
        credential: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    CreateIdentityFileAuthentication:
      type: object
      additionalProperties: false
      required: [kind, keyId]
      properties:
        kind: { type: string, enum: [identity_file], x-go-type: string }
        keyId: { type: string, minLength: 32, maxLength: 32 }
    CreateConnectionResponse:
      type: object
      additionalProperties: false
      required: [transactionId, identity, preview]
      properties:
        transactionId: { type: string }
        identity: { $ref: "#/components/schemas/HostIdentity" }
        preview: { $ref: "#/components/schemas/SavePreview" }
    UpdateConnectionRequest:
      type: object
      additionalProperties: false
      required: [identity, base, password, keyPassphrase]
      properties:
        identity: { $ref: "#/components/schemas/HostIdentity" }
        base: { type: string, maxLength: 1048576 }
        hostName: { $ref: "#/components/schemas/ConnectionStringChange" }
        user: { $ref: "#/components/schemas/ConnectionStringChange" }
        port: { $ref: "#/components/schemas/ConnectionPortChange" }
        identityFile: { $ref: "#/components/schemas/ConnectionIdentityFileChange" }
        password: { $ref: "#/components/schemas/UpdateConnectionPassword" }
        keyPassphrase: { $ref: "#/components/schemas/UpdateConnectionKeyPassphrase" }
    ConnectionStringChange:
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/ConnectionStringSet"
        - $ref: "#/components/schemas/ConnectionInherit"
      discriminator:
        propertyName: action
        mapping:
          set: "#/components/schemas/ConnectionStringSet"
          inherit: "#/components/schemas/ConnectionInherit"
    ConnectionStringSet:
      type: object
      additionalProperties: false
      required: [action, value]
      properties:
        action: { type: string, enum: [set], x-go-type: string }
        value: { type: string, maxLength: 255 }
    ConnectionPortChange:
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/ConnectionPortSet"
        - $ref: "#/components/schemas/ConnectionInherit"
      discriminator:
        propertyName: action
        mapping:
          set: "#/components/schemas/ConnectionPortSet"
          inherit: "#/components/schemas/ConnectionInherit"
    ConnectionPortSet:
      type: object
      additionalProperties: false
      required: [action, value]
      properties:
        action: { type: string, enum: [set], x-go-type: string }
        value: { type: integer, minimum: 1, maximum: 65535 }
    ConnectionIdentityFileChange:
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/ConnectionIdentityFileSet"
        - $ref: "#/components/schemas/ConnectionInherit"
      discriminator:
        propertyName: action
        mapping:
          set: "#/components/schemas/ConnectionIdentityFileSet"
          inherit: "#/components/schemas/ConnectionInherit"
    ConnectionIdentityFileSet:
      type: object
      additionalProperties: false
      required: [action, keyId]
      properties:
        action: { type: string, enum: [set], x-go-type: string }
        keyId: { type: string, minLength: 32, maxLength: 32 }
    ConnectionInherit:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [inherit], x-go-type: string }
    UpdateConnectionPassword:
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/UpdatePasswordUnchanged"
        - $ref: "#/components/schemas/CreateDedicatedPasswordAuthentication"
        - $ref: "#/components/schemas/CreateSavedPasswordAuthentication"
        - $ref: "#/components/schemas/CreateNewSharedPasswordAuthentication"
        - $ref: "#/components/schemas/UpdatePasswordRemove"
      discriminator:
        propertyName: kind
        mapping:
          unchanged: "#/components/schemas/UpdatePasswordUnchanged"
          dedicated_password: "#/components/schemas/CreateDedicatedPasswordAuthentication"
          saved_password: "#/components/schemas/CreateSavedPasswordAuthentication"
          new_shared_password: "#/components/schemas/CreateNewSharedPasswordAuthentication"
          remove: "#/components/schemas/UpdatePasswordRemove"
    UpdatePasswordUnchanged:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [unchanged], x-go-type: string }
    UpdatePasswordRemove:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [remove], x-go-type: string }
    UpdateConnectionKeyPassphrase:
      x-go-type: json.RawMessage
      oneOf:
        - $ref: "#/components/schemas/ConnectionKeyPassphraseUnchanged"
        - $ref: "#/components/schemas/ConnectionKeyPassphraseSetDedicated"
      discriminator:
        propertyName: kind
        mapping:
          unchanged: "#/components/schemas/ConnectionKeyPassphraseUnchanged"
          set_dedicated: "#/components/schemas/ConnectionKeyPassphraseSetDedicated"
    ConnectionKeyPassphraseUnchanged:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [unchanged], x-go-type: string }
    ConnectionKeyPassphraseSetDedicated:
      type: object
      additionalProperties: false
      required: [kind, keyId, passphrase]
      properties:
        kind: { type: string, enum: [set_dedicated], x-go-type: string }
        keyId: { type: string, minLength: 32, maxLength: 32 }
        passphrase: { type: string, minLength: 1, maxLength: 1024 }
    RelocateKeyRequest:
      type: object
      additionalProperties: false
      properties:
        newName: { type: string, minLength: 1, maxLength: 64 }
        group: { type: string, maxLength: 400 }
    RelocatedKeyFile:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    RewrittenKeyReference:
      type: object
      additionalProperties: false
      required: [directive, configPath, line, from, to]
      properties:
        directive: { type: string }
        configPath: { type: string }
        line: { type: integer }
        from: { type: string }
        to: { type: string }
    RelocateKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, group, files, references, skipped, notes, blockers, transactionId]
      properties:
        id: { type: string }
        relativePath: { type: string }
        group: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/RelocatedKeyFile" } }
        references: { type: array, items: { $ref: "#/components/schemas/RewrittenKeyReference" } }
        skipped: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        transactionId: { type: string }
    RegisterKeyRequest:
      type: object
      additionalProperties: false
      required: [passphrase, lifetimeSeconds]
      properties:
        passphrase: { type: string, maxLength: 1024 }
        lifetimeSeconds: { type: integer }
    RegisterKeyResponse:
      type: object
      additionalProperties: false
      required: [id, relativePath, fingerprint, lifetimeSeconds, identities]
      properties:
        id: { type: string }
        relativePath: { type: string }
        fingerprint: { type: string }
        lifetimeSeconds: { type: integer }
        identities: { type: array, items: { $ref: "#/components/schemas/AgentIdentity" } }
    TrashFileSummary:
      type: object
      additionalProperties: false
      required: [originalRelativePath, trashRelativePath, kind, fingerprint, permission]
      properties:
        originalRelativePath: { type: string }
        trashRelativePath: { type: string }
        kind: { type: string }
        fingerprint: { type: string }
        permission: { type: string }
    TrashEntrySummary:
      type: object
      additionalProperties: false
      required: [id, deletedAt, ageDays, stale, files, restorable, blockers]
      properties:
        id: { type: string }
        deletedAt: { type: string }
        ageDays: { type: integer }
        stale: { type: boolean }
        files: { type: array, items: { $ref: "#/components/schemas/TrashFileSummary" } }
        restorable: { type: boolean }
        blockers: { type: array, items: { type: string } }
    TrashListResponse:
      type: object
      additionalProperties: false
      required: [entries, retentionDays]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/TrashEntrySummary" } }
        retentionDays: { type: integer }
    TrashKeyResponse:
      type: object
      additionalProperties: false
      required: [entryId, files, skipped, transactionId]
      properties:
        entryId: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/TrashFileSummary" } }
        skipped: { type: array, items: { type: string } }
        transactionId: { type: string }
    RestoreTrashResponse:
      type: object
      additionalProperties: false
      required: [entryId, restored, blockers, transactionId]
      properties:
        entryId: { type: string }
        restored: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        transactionId: { type: string }
    PurgeTrashResponse:
      type: object
      additionalProperties: false
      required: [entryId, removed, transactionId]
      properties:
        entryId: { type: string }
        removed: { type: array, items: { type: string } }
        transactionId: { type: string }
    FileRef:
      type: object
      additionalProperties: false
      required: [absolute]
      properties:
        path: { type: string }
        absolute: { type: string }
        external: { type: boolean }
    Notice:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        path: { type: string }
        line: { type: integer }
        detail: { type: string }
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, code]
      properties:
        severity: { type: string }
        code: { type: string }
        path: { type: string }
        absolute: { type: string }
        external: { type: boolean }
        line: { type: integer }
        detail: { type: string }
    HostIdentity:
      type: object
      additionalProperties: false
      required: [path, alias]
      properties:
        path: { type: string }
        alias: { type: string }
    RecentConnection:
      type: object
      additionalProperties: false
      required: [alias, hostName, user, port, lastConnectedAt]
      properties:
        alias: { type: string }
        hostName: { type: string }
        user: { type: string }
        port: { type: string }
        lastConnectedAt: { type: string, format: date-time }
    RecentConnectionList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RecentConnection" }
    HostEntry:
      type: object
      additionalProperties: false
      required: [identity, file, line, patterns, editable]
      properties:
        identity: { $ref: "#/components/schemas/HostIdentity" }
        file: { $ref: "#/components/schemas/FileRef" }
        line: { type: integer }
        patterns: { type: array, items: { type: string } }
        wildcard: { type: boolean }
        negated: { type: boolean }
        duplicate: { type: boolean }
        editable: { type: boolean }
        group: { type: string }
        hostName:
          type: string
          description: Resolved SSH destination hostname used by this alias.
        user:
          type: string
          description: Resolved remote account used by this alias.
        port:
          type: string
          description: Resolved SSH port used by this alias.
    IncludeReference:
      type: object
      additionalProperties: false
      required: [line, pattern]
      properties:
        line: { type: integer }
        pattern: { type: string }
        condition: { type: string }
        matches: { type: array, items: { $ref: "#/components/schemas/FileRef" } }
    FileNode:
      type: object
      additionalProperties: false
      required: [file, editable, loads]
      properties:
        file: { $ref: "#/components/schemas/FileRef" }
        missing: { type: boolean }
        editable: { type: boolean }
        loads: { type: integer }
        includes: { type: array, items: { $ref: "#/components/schemas/IncludeReference" } }
    Setting:
      type: object
      additionalProperties: false
      required: [keyword, values]
      properties:
        keyword: { type: string }
        values: { type: array, items: { type: string } }
    HostMetadata:
      type: object
      additionalProperties: false
      required: [identity]
      properties:
        identity: { $ref: "#/components/schemas/HostIdentity" }
        tags: { type: array, items: { type: string } }
        colour: { type: string }
        note: { type: string }
        order: { type: integer }
        orphan: { type: boolean }
        appearance: { $ref: "#/components/schemas/TerminalAppearance" }
        encoding:
          type: string
          enum: [utf-8, shift_jis, euc-jp, iso-2022-jp]
          description: Text encoding used by this SSH terminal. Omitted means UTF-8.
        osc52:
          type: string
          enum: [allow, deny]
          description: Per-connection OSC 52 override. Omitted inherits the terminal default.
    # 端末の表示設定。接続単位と全体設定を項目ごとに解決し、未設定項目はアプリの
    # テーマを使う。配色とフォントは名前で参照し、未知の名前は既定値へ戻す。
    TerminalAppearance:
      type: object
      additionalProperties: false
      properties:
        palette: { type: string, maxLength: 64 }
        font: { type: string, maxLength: 64 }
        # 置いてある画像の名前。空は「選んでいない」。
        background: { type: string, maxLength: 128 }
        # 画像の上にかぶせる濃さ。0 は素のまま、100 は配色の背景色で覆い尽くす。
        #
        # 0 は有効な値。省略時は上位設定または既定値を使う。
        backgroundTint: { type: integer, minimum: 0, maximum: 100 }
    GroupMetadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        colour: { type: string }
        note: { type: string }
        order: { type: integer }
        # 表示だけのもの。他のグループを収めることが目的のグループは、接続の
        # ツリーに自分自身として見せるものを持たない。これはその見出しをツリーから
        # 外す。OpenSSH が読むものは何も変わらない。
        hidden: { type: boolean }
        settings: { type: array, items: { $ref: "#/components/schemas/Setting" } }
    Metadata:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion: { type: integer }
        groupsFile: { type: string }
        embeddedTerminal: { $ref: "#/components/schemas/EmbeddedTerminal" }
        engine: { $ref: "#/components/schemas/EngineSettings" }
        # 転送キューの設定は engine のものだが、engine 節とは別に置く。Settings
        # 画面の engine 保存は節ごと置き換えるため、同居させると消える。
        fileTransfers: { $ref: "#/components/schemas/FileTransferSettings" }
        groups: { type: array, items: { $ref: "#/components/schemas/GroupMetadata" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/HostMetadata" } }
    # SFTP転送キューの設定。engine processではなくmetadataが持ち、再起動しても残る。
    FileTransferSettings:
      type: object
      additionalProperties: false
      properties:
        maxConcurrent: { type: integer, minimum: 1, maximum: 8 }
        # 0 または省略時は、完了項目を自動では消さない。
        clearCompletedAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
        # 待機中のjobを新しく開始しない。実行中のものはそのまま終わる。
        processingStopped: { type: boolean }
        largeFileThresholdBytes: { type: integer, format: int64, minimum: 16777216, maximum: 1073741824 }
        largeFileParallelism: { type: integer, minimum: 1, maximum: 8 }
        largeFileChunkBytes: { type: integer, format: int64, minimum: 8388608, maximum: 4294967296 }
    # 埋め込みターミナルの設定。数値の範囲外は読み取りで既定へ戻し、書き込みでは拒否する。
    EmbeddedTerminal:
      type: object
      additionalProperties: false
      properties:
        maxSessions: { type: integer, minimum: 1, maximum: 200 }
        scrollbackBytes: { type: integer, minimum: 16384, maximum: 4194304 }
        browserScrollbackLines: { type: integer, minimum: 1000, maximum: 100000 }
        fontSize: { type: integer, minimum: 8, maximum: 32 }
        # 無いときは on。false は利用者が明示的に止めた値なので、省略せず運ぶ。
        # 接続の途中経過をどこまで端末へ書くか。0 は無言、3 は `ssh -vvv` 相当。
        #
        # 接続失敗または切断の理由を UI に表示するためのイベント。
        # その場で読めなければ意味が無い。
        verbosity: { type: integer, minimum: 0, maximum: 3 }
        # 通信切断後の再接続試行回数。0 は再接続しない設定。
        #
        # 閉じたコンソールがしばらく残って見えるのは、ここが粘っているあいだで
        # ある。切りたいユーザーは 0 を置く。間隔は 1・2・5・10・15 秒なので、
        # 5 回なら諦めるまで 33 秒。
        reconnect: { type: integer, minimum: 0, maximum: 5 }
        copyOnSelect: { type: boolean }
        rightClickPaste: { type: boolean }
        osc52: { type: boolean }
        jisYenBackslash: { type: boolean }
        localShellProfile: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        # ローカルシェルの開始ディレクトリ。`~` を維持し、空なら home を使う。
        startDirectory: { type: string, maxLength: 4096 }
        appearance: { $ref: "#/components/schemas/TerminalAppearance" }
    # 埋め込みターミナルのうち、画面から変えられるもの。
    #
    # セクション全体を置き換える。省略項目は未設定として保存する。
    # 既定値は metadata に保存せず、将来の既定値変更を反映できるようにする。
    TerminalSettings:
      type: object
      additionalProperties: false
      properties:
        startDirectory: { type: string, maxLength: 4096 }
        maxSessions: { type: integer, minimum: 1, maximum: 200 }
        scrollbackBytes: { type: integer, minimum: 16384, maximum: 4194304 }
        browserScrollbackLines: { type: integer, minimum: 1000, maximum: 100000 }
        # 字の大きさは画面のものであって engine のものではない。PTY は px を
        # 知らない。ここに置くのは、端末ごとに読みやすい大きさが違うからで、
        # 指で持つ画面と机の上の画面では同じ数字が別の意味になる。
        fontSize: { type: integer, minimum: 8, maximum: 32 }
        # 接続の途中経過をどこまで端末へ書くか。0 は無言、3 は `ssh -vvv` 相当。
        #
        # 接続失敗または切断の理由を UI に表示するためのイベント。
        # その場で読めなければ意味が無い。
        verbosity: { type: integer, minimum: 0, maximum: 3 }
        # 通信切断後の再接続試行回数。0 は再接続しない設定。
        #
        # 閉じたコンソールがしばらく残って見えるのは、ここが粘っているあいだで
        # ある。切りたいユーザーは 0 を置く。間隔は 1・2・5・10・15 秒なので、
        # 5 回なら諦めるまで 33 秒。
        reconnect: { type: integer, minimum: 0, maximum: 5 }
        copyOnSelect: { type: boolean }
        rightClickPaste: { type: boolean }
        osc52: { type: boolean }
        jisYenBackslash: { type: boolean }
        localShellProfile: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        appearance: { $ref: "#/components/schemas/TerminalAppearance" }
    # engine の設定。
    #
    # 受け口の番号は engine が起動時に読むので、変えても次に起動するまで効かない。
    # 画面はそう言う。
    VaultAutoLockSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [idle, restart]
          description: idleは無操作時間後、restartは手動ロックまたはengine終了時だけロックする。
        value:
          type: integer
          minimum: 1
          maximum: 999
        unit:
          type: string
          enum: [minutes, hours]
    EngineSettings:
      type: object
      additionalProperties: false
      properties:
        # 0 または省略時は 30000〜60000 からランダムに選ぶ。ポート番号は秘密情報ではない。
        port: { type: integer, minimum: 1024, maximum: 65535 }
        # 省略時は12時間。restartは自動ロックを無効にする。
        vaultAutoLock: { $ref: "#/components/schemas/VaultAutoLockSettings" }
    TerminalBackground:
      type: object
      additionalProperties: false
      required: [name, bytes, type]
      properties:
        name: { type: string }
        bytes: { type: integer }
        type: { type: string }
    TerminalBackgroundList:
      type: object
      additionalProperties: false
      required: [backgrounds, remainingBytes]
      properties:
        backgrounds: { type: array, items: { $ref: "#/components/schemas/TerminalBackground" } }
        # 追加保存できる残りバイト数。
        remainingBytes: { type: integer }
    PendingTransaction:
      type: object
      additionalProperties: false
      required: [id, operation, status, startedAt, committed, paths, canComplete]
      properties:
        id: { type: string }
        operation: { type: string }
        status: { type: string }
        startedAt: { type: string }
        committed: { type: integer }
        paths: { type: array, items: { type: string } }
        canComplete: { type: boolean }
    Overview:
      type: object
      additionalProperties: false
      required: [entry, files, hosts, groups, metadata, diagnostics, notices]
      properties:
        entry: { $ref: "#/components/schemas/FileRef" }
        files: { type: array, items: { $ref: "#/components/schemas/FileNode" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/HostEntry" } }
        # 宣言済みのグループと、それぞれが何を保持しているか、そしてその
        # ディレクトリが存在するか。connections/ 配下にあっても、どの Include も
        # 指定していないディレクトリはこれに含まれず、group_not_declared の
        # 注意として届く。
        groups: { type: array, items: { $ref: "#/components/schemas/GroupView" } }
        metadata: { $ref: "#/components/schemas/Metadata" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
        pending: { type: array, items: { $ref: "#/components/schemas/PendingTransaction" } }
    GroupView:
      type: object
      additionalProperties: false
      required: [name, directory, keyDirectory, memberCount, directoryPresent]
      properties:
        name: { type: string }
        parent: { type: string }
        directory: { type: string }
        keyDirectory: { type: string }
        colour: { type: string }
        note: { type: string }
        order: { type: integer }
        settings: { type: array, items: { $ref: "#/components/schemas/Setting" } }
        memberCount: { type: integer }
        directoryPresent: { type: boolean }
    FormField:
      type: object
      additionalProperties: false
      required: [line, keyword, values, category, editable]
      properties:
        line: { type: integer }
        keyword: { type: string }
        values: { type: array, items: { type: string } }
        category: { type: string }
        dangerous: { type: boolean }
        duplicate: { type: boolean }
        editable: { type: boolean }
    HostForm:
      type: object
      additionalProperties: false
      required: [entry, fields, raw, comment, commentLines]
      properties:
        entry: { $ref: "#/components/schemas/HostEntry" }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }
        raw: { type: string }
        comment:
          type: string
          description: >-
            The comment lines attached above the Host line, with the '#' markers
            stripped. Empty when the block has none. ssh_config has no trailing
            comment syntax, so only whole lines are ever attached.
        commentLines:
          type: integer
          description: >-
            How many physical lines the attached comment occupies. A client
            rewriting the whole file needs the count to include those lines;
            it cannot be derived from comment, whose markers and indentation
            were stripped.
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
    Source:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        absolute: { type: string }
        line: { type: integer }
        condition: { type: string }
    EffectiveEntry:
      type: object
      additionalProperties: false
      required: [keyword, values, source]
      properties:
        keyword: { type: string }
        values: { type: array, items: { type: string } }
        source: { $ref: "#/components/schemas/Source" }
    Effective:
      type: object
      additionalProperties: false
      required: [alias, entries]
      properties:
        alias: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/EffectiveEntry" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
    FileContents:
      type: object
      additionalProperties: false
      required: [file, contents, digest, editable, exists]
      properties:
        file: { $ref: "#/components/schemas/FileRef" }
        contents: { type: string }
        digest: { type: string }
        editable: { type: boolean }
        exists: { type: boolean }
    HostDetail:
      type: object
      additionalProperties: false
      required: [form, metadata, effective, file]
      properties:
        form: { $ref: "#/components/schemas/HostForm" }
        metadata: { $ref: "#/components/schemas/HostMetadata" }
        effective: { $ref: "#/components/schemas/Effective" }
        file: { $ref: "#/components/schemas/FileContents" }
    FieldEdit:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string }
        line: { type: integer }
        keyword: { type: string }
        values: { type: array, items: { type: string } }
    EditRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string }
        path: { type: string }
        base: { type: string }
        alias: { type: string }
        newAlias: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/FieldEdit" } }
        raw: { type: string }
        comment: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        destinationGroup: { type: string, maxLength: 400 }
        destinationPath: { type: string }
        destinationBase: { type: string }
    DiffLine:
      type: object
      additionalProperties: false
      required: [op, text]
      properties:
        op: { type: string }
        text: { type: string }
        oldLine: { type: integer }
        newLine: { type: integer }
    FileDiff:
      type: object
      additionalProperties: false
      required: [path, lines]
      properties:
        path: { type: string }
        created: { type: boolean }
        removed: { type: boolean }
        oldDigest: { type: string }
        newDigest: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/DiffLine" } }
        truncated: { type: boolean }
    EffectiveChange:
      type: object
      additionalProperties: false
      required: [keyword, before, after]
      properties:
        keyword: { type: string }
        before: { type: array, items: { type: string } }
        after: { type: array, items: { type: string } }
        beforeSources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        afterSources: { type: array, items: { $ref: "#/components/schemas/Source" } }
    EffectiveDiff:
      type: object
      additionalProperties: false
      required: [alias, changes]
      properties:
        alias: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/EffectiveChange" } }
    SavePreview:
      type: object
      additionalProperties: false
      required: [operation, diffs]
      properties:
        operation: { type: string }
        diffs: { type: array, items: { $ref: "#/components/schemas/FileDiff" } }
        effective: { type: array, items: { $ref: "#/components/schemas/EffectiveDiff" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
    SaveResult:
      type: object
      additionalProperties: false
      required: [transactionId, written, preview]
      properties:
        transactionId: { type: string }
        written: { type: array, items: { type: string } }
        preview: { $ref: "#/components/schemas/SavePreview" }
    ConflictReport:
      type: object
      additionalProperties: false
      required: [path, externalChange, localChange]
      properties:
        path: { type: string }
        baseDigest: { type: string }
        diskDigest: { type: string }
        externalChange: { type: array, items: { $ref: "#/components/schemas/DiffLine" } }
        localChange: { type: array, items: { $ref: "#/components/schemas/DiffLine" } }
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [id, operation, status, startedAt, paths]
      properties:
        id: { type: string }
        operation: { type: string }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        paths: { type: array, items: { type: string } }
        restorable: { type: array, items: { type: string } }
    HistoryList:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
    RestoreRequest:
      type: object
      additionalProperties: false
      required: [transactionId, path]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 512 }
    RecoverRequest:
      type: object
      additionalProperties: false
      required: [transactionId, action]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 16 }
    RecoverResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok], x-go-type: string }
    ChangedResponse:
      type: object
      additionalProperties: false
      required: [changed]
      properties: { changed: { type: boolean } }
    SFTPEntry:
      type: object
      additionalProperties: false
      required: [name, path, type, size, mode, modifiedAt, revision]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, directory, symlink, other] }
        size: { type: integer, format: int64, minimum: 0 }
        mode: { type: string }
        modifiedAt: { type: string, format: date-time }
        revision: { type: string }
    SFTPListing:
      type: object
      additionalProperties: false
      required: [path, entries]
      properties:
        path: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/SFTPEntry" } }
    SFTPTextFile:
      type: object
      additionalProperties: false
      required: [entry, contents, revision]
      properties:
        entry: { $ref: "#/components/schemas/SFTPEntry" }
        contents: { type: string, maxLength: 2097152 }
        revision: { type: string }
    SFTPSaveTextRequest:
      type: object
      additionalProperties: false
      required: [contents, expectedRevision]
      properties:
        contents: { type: string, maxLength: 2097152 }
        expectedRevision: { type: string, minLength: 1 }
    SFTPMkdirRequest:
      type: object
      additionalProperties: false
      required: [path, type]
      properties:
        path: { type: string }
        type: { type: string, enum: [directory] }
    SFTPRenameRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties: { from: { type: string }, to: { type: string } }
    SFTPChmodRequest:
      type: object
      additionalProperties: false
      required: [path, mode, expectedRevision]
      properties:
        path: { type: string }
        mode: { type: string, pattern: "^0?[0-7]{3}$" }
        expectedRevision: { type: string, minLength: 1 }
    SFTPTransfer:
      type: object
      additionalProperties: false
      required: [path, bytes, revision]
      properties:
        path: { type: string }
        bytes: { type: integer, format: int64, minimum: 0 }
        revision: { type: string }
    SFTPTransferJob:
      type: object
      additionalProperties: false
      required: [id, batchId, batchName, batchKind, alias, sourceAlias, sourcePath, operation, direction, kind, name, remotePath, totalBytes, transferredBytes, bytesPerSecond, remainingSeconds, status, allowedActions, attempt, problem, lastModified, expectedRevision, sourceFingerprint, overwrite, downloadRevision, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
        batchId: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
        batchName: { type: string, minLength: 1, maxLength: 1024 }
        batchKind: { type: string, enum: [file, folder] }
        alias: { type: string, minLength: 1, maxLength: 255 }
        sourceAlias: { type: string, maxLength: 255 }
        sourcePath: { type: string }
        operation: { type: string, enum: ["", copy, move] }
        direction: { type: string, enum: [upload, download, remote] }
        kind: { type: string, enum: [file, folder] }
        name: { type: string, minLength: 1, maxLength: 1024 }
        remotePath: { type: string, minLength: 1 }
        totalBytes: { type: integer, format: int64, minimum: -1 }
        transferredBytes: { type: integer, format: int64, minimum: 0 }
        bytesPerSecond: { type: number, format: double, minimum: 0 }
        remainingSeconds: { type: integer, format: int64, minimum: -1 }
        status: { type: string, enum: [queued, running, paused, reattach, needs_overwrite, completed, failed, cancelled] }
        allowedActions:
          type: array
          uniqueItems: true
          maxItems: 3
          items: { type: string, enum: [pause, resume, retry, cancel, remove] }
        attempt: { type: integer, minimum: 1 }
        problem: { type: string, maxLength: 128 }
        lastModified: { type: integer, format: int64, minimum: 0 }
        expectedRevision: { type: string, maxLength: 256 }
        sourceFingerprint: { type: string, maxLength: 128 }
        overwrite: { type: boolean }
        downloadRevision: { type: string, maxLength: 256 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SFTPTransferJobList:
      type: object
      additionalProperties: false
      required: [maxConcurrent, clearCompletedAfterSeconds, processingStopped, largeFileThresholdBytes, largeFileParallelism, largeFileChunkBytes, jobs]
      properties:
        maxConcurrent: { type: integer, minimum: 1, maximum: 8 }
        # 0 means finished jobs are only removed on request.
        clearCompletedAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
        # While stopped, waiting jobs stay waiting; running ones finish.
        processingStopped: { type: boolean }
        largeFileThresholdBytes: { type: integer, format: int64, minimum: 16777216, maximum: 1073741824 }
        largeFileParallelism: { type: integer, minimum: 1, maximum: 8 }
        largeFileChunkBytes: { type: integer, format: int64, minimum: 8388608, maximum: 4294967296 }
        jobs: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/SFTPTransferJob" } }
    SFTPSearchResult:
      type: object
      additionalProperties: false
      required: [path, query, truncated, entries]
      properties:
        path: { type: string }
        query: { type: string }
        # true means a budget stopped the walk before it finished.
        truncated: { type: boolean }
        entries: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/SFTPEntry" } }
    SFTPDirectoryDifference:
      type: object
      additionalProperties: false
      required: [relativePath, status]
      properties:
        relativePath: { type: string }
        status: { type: string, enum: [same, different, left_only, right_only, type_mismatch] }
        left: { $ref: "#/components/schemas/SFTPEntry" }
        right: { $ref: "#/components/schemas/SFTPEntry" }
    SFTPDirectoryComparison:
      type: object
      additionalProperties: false
      required: [leftPath, rightPath, entries]
      properties:
        leftPath: { type: string }
        rightPath: { type: string }
        entries: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/SFTPDirectoryDifference" } }
    SFTPTransferSettingsRequest:
      type: object
      additionalProperties: false
      required: [maxConcurrent, clearCompletedAfterSeconds, processingStopped, largeFileThresholdBytes, largeFileParallelism, largeFileChunkBytes]
      properties:
        maxConcurrent: { type: integer, minimum: 1, maximum: 8 }
        clearCompletedAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
        processingStopped: { type: boolean }
        largeFileThresholdBytes: { type: integer, format: int64, minimum: 16777216, maximum: 1073741824 }
        largeFileParallelism: { type: integer, minimum: 1, maximum: 8 }
        largeFileChunkBytes: { type: integer, format: int64, minimum: 8388608, maximum: 4294967296 }
    SFTPTransferQueueMoveRequest:
      type: object
      additionalProperties: false
      required: [move]
      properties:
        move: { type: string, enum: [up, down, top, bottom] }
    SFTPCreateTransferJobRequest:
      type: object
      additionalProperties: false
      required: [id, batchId, batchName, batchKind, alias, sourceAlias, sourcePath, operation, overwrite, direction, kind, name, remotePath, totalBytes, lastModified]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
        batchId: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
        batchName: { type: string, minLength: 1, maxLength: 1024 }
        batchKind: { type: string, enum: [file, folder] }
        alias: { type: string, minLength: 1, maxLength: 255 }
        sourceAlias: { type: string, maxLength: 255 }
        sourcePath: { type: string }
        operation: { type: string, enum: ["", copy, move] }
        overwrite: { type: boolean }
        direction: { type: string, enum: [upload, download, remote] }
        kind: { type: string, enum: [file, folder] }
        name: { type: string, minLength: 1, maxLength: 1024 }
        remotePath: { type: string, minLength: 1 }
        totalBytes: { type: integer, format: int64, minimum: -1 }
        lastModified: { type: integer, format: int64, minimum: 0 }
        # Optional per-file split-transfer overrides for uploads and downloads. Omission inherits the engine settings.
        largeFileThresholdBytes: { type: integer, format: int64, minimum: 16777216, maximum: 1073741824 }
        largeFileParallelism: { type: integer, minimum: 1, maximum: 8 }
        largeFileChunkBytes: { type: integer, format: int64, minimum: 8388608, maximum: 4294967296 }
    SFTPTransferJobActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [start, pause, resume, retry, cancel, progress, complete, fail, needs_overwrite] }
        transferredBytes: { type: integer, format: int64, minimum: 0 }
        totalBytes: { type: integer, format: int64, minimum: 0 }
        problem: { type: string, maxLength: 128 }
        resetProgress: { type: boolean }
    SFTPDownloadCheckpointRequest:
      type: object
      additionalProperties: false
      required: [offset, revision]
      properties:
        offset: { type: integer, format: int64, minimum: 0 }
        revision: { type: string, minLength: 1, maxLength: 256 }
    SFTPStartUploadRequest:
      type: object
      additionalProperties: false
      required: [path, size, sourceFingerprint]
      properties:
        path: { type: string }
        size: { type: integer, format: int64, minimum: 0, maximum: 549755813888 }
        sourceFingerprint: { type: string, pattern: '^tree-sha256:[0-9a-f]{64}$' }
    SFTPCompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [path, size, expectedRevision, sourceFingerprint]
      properties:
        path: { type: string }
        size: { type: integer, format: int64, minimum: 0 }
        expectedRevision: { type: string, minLength: 1 }
        sourceFingerprint: { type: string, pattern: '^tree-sha256:[0-9a-f]{64}$' }
    SFTPResumableUpload:
      type: object
      additionalProperties: false
      required: [id, path, offset, size, expectedRevision, completedRanges, parallelism, chunkBytes]
      properties:
        id: { type: string }
        path: { type: string }
        offset: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 0 }
        expectedRevision: { type: string }
        completedRanges:
          type: array
          maxItems: 65536
          items: { $ref: "#/components/schemas/SFTPUploadRange" }
        parallelism: { type: integer, minimum: 1, maximum: 8 }
        chunkBytes: { type: integer, format: int64, minimum: 8388608, maximum: 4294967296 }
    SFTPUploadRange:
      type: object
      additionalProperties: false
      required: [offset, size]
      properties:
        offset: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1, maximum: 4294967296 }
    WorkspacePane:
      type: object
      additionalProperties: false
      required: [id, alias]
      properties:
        id: { type: string }
        alias: { type: string }
        kind: { type: string, enum: [ssh, shell], description: Omitted by legacy SSH-only workspaces and interpreted as ssh. }
    WorkspaceSplit:
      type: object
      additionalProperties: false
      required: [direction, ratio, first, second]
      properties:
        direction: { type: string, enum: [horizontal, vertical] }
        ratio: { type: integer, minimum: 10, maximum: 90 }
        first: { $ref: "#/components/schemas/WorkspaceNode" }
        second: { $ref: "#/components/schemas/WorkspaceNode" }
    WorkspaceNode:
      type: object
      additionalProperties: false
      x-sshc-exactly-one:
        - [pane, split]
      properties:
        pane: { $ref: "#/components/schemas/WorkspacePane" }
        split: { $ref: "#/components/schemas/WorkspaceSplit" }
    WorkspaceDefinition:
      type: object
      additionalProperties: false
      required: [name, layout, focusedPaneId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        layout: { $ref: "#/components/schemas/WorkspaceNode" }
        focusedPaneId: { type: string }
    TerminalWorkspace:
      type: object
      additionalProperties: false
      required: [name, layout, focusedPaneId, id, createdAt, updatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        layout: { $ref: "#/components/schemas/WorkspaceNode" }
        focusedPaneId: { type: string }
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties: { workspaces: { type: array, items: { $ref: "#/components/schemas/TerminalWorkspace" } } }
    WorkspaceReconnectPane:
      type: object
      additionalProperties: false
      required: [paneId, alias, kind, state]
      properties:
        paneId: { type: string }
        alias: { type: string }
        kind: { type: string, enum: [ssh, shell] }
        state: { type: string, enum: [reconnect_required] }
    WorkspaceRestorePlan:
      type: object
      additionalProperties: false
      required: [workspace, panes]
      properties:
        workspace: { $ref: "#/components/schemas/TerminalWorkspace" }
        panes: { type: array, items: { $ref: "#/components/schemas/WorkspaceReconnectPane" } }
    SnippetVariable:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, integer, boolean, secret] }
        required: { type: boolean }
        default: { type: string }
        description: { type: string }
    SnippetDraft:
      type: object
      additionalProperties: false
      required: [name, description, command, variables]
      properties:
        name: { type: string, minLength: 1, maxLength: 96 }
        description: { type: string, maxLength: 2048 }
        command: { type: string, minLength: 1, maxLength: 65536 }
        variables: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/SnippetVariable" } }
    Snippet:
      type: object
      additionalProperties: false
      required: [name, description, command, variables, id, createdAt, updatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 96 }
        description: { type: string, maxLength: 2048 }
        command: { type: string, minLength: 1, maxLength: 65536 }
        variables: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/SnippetVariable" } }
        id: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StartupSnippet:
      type: object
      additionalProperties: false
      required: [alias, snippetId]
      properties:
        alias: { type: string }
        snippetId: { type: string }
        inputs: { type: object, additionalProperties: { type: string } }
    StartupSnippetRequest:
      type: object
      additionalProperties: false
      required: [snippetId, inputs]
      properties:
        snippetId: { type: string }
        inputs: { type: object, additionalProperties: { type: string } }
    SnippetLibrary:
      type: object
      additionalProperties: false
      required: [snippets, startup]
      properties:
        snippets: { type: array, items: { $ref: "#/components/schemas/Snippet" } }
        startup: { type: array, items: { $ref: "#/components/schemas/StartupSnippet" } }
    SnippetPreviewRequest:
      type: object
      additionalProperties: false
      x-sshc-exactly-one:
        - [snippetId, command]
        - [aliases, targets]
      description: Exactly one of snippetId or command and exactly one of aliases or targets must be supplied. targets permits repeated aliases when targetId values are distinct.
      required: [inputs]
      properties:
        snippetId: { type: string }
        command: { type: string, minLength: 1, maxLength: 65536 }
        aliases: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        targets: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/SnippetExecutionTarget" } }
        inputs: { type: object, additionalProperties: { type: string } }
    SnippetExecutionTarget:
      type: object
      additionalProperties: false
      required: [targetId, alias]
      properties:
        targetId: { type: string, minLength: 1, maxLength: 255 }
        alias: { type: string, minLength: 1, maxLength: 255 }
    SnippetPreviewTarget:
      type: object
      additionalProperties: false
      required: [targetId, target, command]
      properties:
        targetId: { type: string }
        target:
          type: object
          additionalProperties: false
          required: [alias, hostName, user, port]
          properties:
            alias: { type: string }
            hostName: { type: string }
            user: { type: string }
            port: { type: string }
            route:
              type: array
              items:
                type: object
                required: [alias, hostName, user, port, strictHostKey, authentication]
                properties:
                  alias: { type: string }
                  hostName: { type: string }
                  user: { type: string }
                  port: { type: string }
                  proxyCommand: { type: string }
                  strictHostKey: { type: string }
                  authentication: { type: array, items: { type: string } }
                  identityFiles: { type: array, items: { type: string } }
                  identitiesOnly: { type: boolean }
                  hostKeyAlgorithms: { type: array, items: { type: string } }
        command: { type: string }
    SnippetPreview:
      type: object
      additionalProperties: false
      required: [snippetId, evidence, targets, actionToken, actionExpiresAt]
      properties:
        snippetId: { type: string }
        evidence: { type: string }
        targets: { type: array, items: { $ref: "#/components/schemas/SnippetPreviewTarget" } }
        actionToken: { type: string }
        actionExpiresAt: { type: string, format: date-time }
    SnippetExecuteRequest:
      type: object
      additionalProperties: false
      x-sshc-exactly-one:
        - [snippetId, command]
        - [aliases, targets]
      description: Exactly one of snippetId or command and exactly one of aliases or targets must be supplied. targets permits repeated aliases when targetId values are distinct.
      required: [inputs, evidence, concurrency]
      properties:
        snippetId: { type: string }
        command: { type: string, minLength: 1, maxLength: 65536 }
        aliases: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        targets: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/SnippetExecutionTarget" } }
        inputs: { type: object, additionalProperties: { type: string } }
        evidence: { type: string }
        concurrency: { type: integer, minimum: 1, maximum: 8 }
    SnippetTargetResult:
      type: object
      additionalProperties: false
      required: [targetId, alias, status]
      properties:
        targetId: { type: string }
        alias: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        exitCode: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        truncated: { type: boolean }
        problem: { type: string }
    SnippetJob:
      type: object
      additionalProperties: false
      required: [id, status, startedAt, results]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, completed, cancelled] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        results: { type: array, items: { $ref: "#/components/schemas/SnippetTargetResult" } }
  responses:
    Problem:
      description: Request rejected
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
