        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/entries:
    parameters: &sftpAlias
      - { name: alias, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    get:
      operationId: listSFTPEntries
      parameters:
        - { name: path, in: query, required: false, description: Omit to list the remote user's working directory, schema: { type: string } }
      responses:
        "200": { description: Remote directory listing, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPListing" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSFTPDirectory
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPMkdirRequest" } } } }
      responses:
        "201": { description: Directory created, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPEntry" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/preview:
    parameters: *sftpAlias
    get:
      operationId: previewSFTPFile
      description: Image bytes for the details dialog. The media type is decided by the leading bytes, never by the name.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Previewable remote file
          headers: { ETag: { required: true, schema: { type: string } } }
          content:
            image/*: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/search:
    parameters: *sftpAlias
    get:
      operationId: searchSFTPEntries
      description: Names matching a query under one remote directory. Symlinks are not followed and the walk is bounded; truncated says so.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "200": { description: Matching remote entries, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPSearchResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/text:
    parameters: *sftpAlias
    get:
      operationId: readSFTPText
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Editable UTF-8 file, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTextFile" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveSFTPText
      parameters: [ { name: path, in: query, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPSaveTextRequest" } } } }
      responses:
        "200": { description: Text saved atomically, content: { application/json: { schema: { $ref: "#/components/schemas/SFTPTextFile" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/download:
    parameters: *sftpAlias
    get:
      operationId: downloadSFTPFile
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: jobId, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
        - { name: verify, in: query, required: false, schema: { type: boolean }, description: Verify an already durable complete OPFS file without requesting an invalid EOF range }
        - { name: Range, in: header, required: false, schema: { type: string, pattern: "^bytes=[0-9]+-$" } }
        - { name: If-Range, in: header, required: false, schema: { type: string }, description: Opaque ETag returned by the first response }
      responses:
        "200":
          description: Remote file bytes, or a replacement from byte zero when If-Range no longer matches
          headers: { ETag: { required: true, schema: { type: string } } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "206":
          description: Remaining bytes of the exact revision named by If-Range
          headers: { ETag: { required: true, schema: { type: string } } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "204": { description: The supplied If-Range revision still owns the complete file }
        "404": { $ref: "#/components/responses/Problem" }
        "416": { $ref: "#/components/responses/Problem" }
  /api/v1/sftp/{alias}/archive:
