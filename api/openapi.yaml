      responses:
        "200":
          description: Trash entry permanently deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeTrashResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
