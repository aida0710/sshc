openapi: 3.0.3
info:
  title: sshc Local API
  version: 0.1.0
paths:
  /api/v1/session/bootstrap:
    post:
      operationId: bootstrapSession
      parameters:
        - name: X-SSHC-Bootstrap
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
        - name: X-SSHC-Browser
          in: header
          required: false
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Session established
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/session/recover:
    post:
      operationId: recoverSession
      parameters:
        - name: X-SSHC-Browser
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Session restored for an enrolled browser
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/session/renew:
    post:
      # リロード後も port-origin ごとの sessionStorage に残る現在の CSRF トークンを
      # 検証し、同じセッションへ新しいトークンを発行する。Cookie はポートに紐づかない
      # ため、Cookie、Origin、Fetch Metadata だけで再発行してはならない。
      operationId: renewSession
      parameters:
        - name: X-SSHC-CSRF
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: A fresh CSRF token for the existing session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Authenticated process health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/actions:
    post:
      operationId: issueActionToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueActionRequest" }
      responses:
        "201":
          description: One-time action token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueActionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/config:
    post:
      operationId: checkConfiguration
      responses:
        "200":
          description: Syntax and Include graph check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheckResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/effective:
    post:
      operationId: inspectEffectiveConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Effective configuration, provenance and jump route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/reachability:
    post:
      operationId: checkReachability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Direct TCP reachability, ignoring ProxyJump
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/authentication:
    post:
      operationId: testAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthenticationRequest" }
      responses:
        "200":
          description: Completed authentication test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticationResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/remote-keys/plan:
    post:
      operationId: planRemoteKeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteKeyPlanRequest" }
      responses:
        "200":
          description: What the registration would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteKeyPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/remote-keys/register:
    post:
      operationId: registerRemoteKey
      parameters:
        - name: X-SSHC-Action
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteKeyRegisterRequest" }
      responses:
        "200":
          description: Completed registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteKeyRegisterResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts:
    get:
      operationId: listKnownHosts
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Matching known_hosts entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/delete:
    post:
      operationId: deleteKnownHosts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsDeleteRequest" }
      responses:
        "200":
          description: Entries removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsChangeResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/scan:
    post:
      operationId: scanKnownHosts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsScanRequest" }
      responses:
        "200":
          description: Unverified candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsScanResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/known-hosts/add:
    post:
      operationId: addKnownHost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownHostsAddRequest" }
      responses:
        "200":
          description: Entry added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownHostsChangeResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions:
    get:
      operationId: listTerminalSessions
      responses:
        "200":
          description: Every open and retained terminal session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: openTerminalSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenTerminalSessionRequest" }
      responses:
        "201":
          description: The session and a single-use ticket for its stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenTerminalSessionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/shell-profiles:
    get:
      operationId: listLocalShellProfiles
      responses:
        "200":
          description: Local shells detected and validated on this machine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalShellProfileList" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/commands/preview:
    post:
      operationId: previewTerminalCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalCommandPreviewRequest" }
      responses:
        "200":
          description: Exact live terminal sessions and expanded command awaiting confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalCommandPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/commands:
    post:
      operationId: dispatchTerminalCommand
      parameters:
        - name: X-SSHC-Action
          in: header
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalCommandDispatchRequest" }
      responses:
        "200":
          description: Per-session PTY delivery results; command output remains in each terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalCommandDispatchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/connections/recent:
    get:
      operationId: listRecentConnections
      responses:
        "200":
          description: Successful SSH connections on this device, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentConnectionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  # リロードしたページは、一覧から自分のセッションを見つけ、そこへ繋ぎ直す。
  # チケットは使い捨てなので、繋ぎ直すたびに新しいものが要る。開くことと
  # 繋ぐことを別のルートにしてあるのはそのためである。
  /api/v1/terminal/sessions/{id}/stream:
    post:
      operationId: issueTerminalStreamTicket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: A single-use ticket bound to this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalStreamTicket" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  # CLI やautomationは画面描画用のraw streamへ接続せず、明示的なlife-cycle
  # stateと、cursorで範囲を指定したplain text transcriptだけを読む。
  /api/v1/terminal/sessions/{id}/control:
    get:
      operationId: controlTerminalSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: cursor
          in: query
          required: false
          schema: { type: integer, format: uint64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 65536, default: 32768 }
      responses:
        "200":
          description: Explicit terminal state and a bounded plain-text transcript fragment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalControlResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}/forwards:
    post:
      operationId: startTerminalForward
      description: Starts one loopback-only local or SOCKS5 forward on an existing connected SSH session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTerminalForwardRequest" }
      responses:
        "201":
          description: The session list containing the newly opened temporary forward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}/forwards/{forwardId}:
    delete:
      operationId: stopTerminalForward
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: forwardId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The session list after closing the selected forward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}/reconnect:
    post:
      operationId: reconnectTerminalSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The session list after reconnecting the exited SSH session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}/agent/resume:
    post:
      operationId: resumeTerminalAgent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResumeTerminalAgentRequest" }
      responses:
        "201":
          description: The resumed agent session and a one-time stream ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenTerminalSessionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}:
    patch:
      operationId: renameTerminalSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameTerminalSessionRequest" }
      responses:
        "200":
          description: The session list after the rename
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }

    delete:
      operationId: closeTerminalSession
      description: Force-stops a live SSH or local process and removes the session from the returned list in one request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The session list after the close
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/terminal/sessions/{id}/title:
    put:
      operationId: setTerminalSessionTitle
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTerminalSessionTitleRequest" }
      responses:
        "200":
          description: The session list after pinning or unpinning the display title
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSessionList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/sync:
    get:
      operationId: getSyncStatus
      responses:
        "200":
          description: Whether a bucket is configured and what was last synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/setup/check:
    post:
      operationId: checkSyncSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncSetupCheckRequest" }
      responses:
        "200":
          description: Exact bucket and path inspected without persisting credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSetupCheckResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/setup:
    put:
      operationId: completeSyncSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncSetupRequest" }
      responses:
        "200":
          description: Verified settings and shared key saved atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSetupResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/settings:
    put:
      operationId: configureSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncSettingsRequest" }
      responses:
        "200":
          description: Bucket configured for this run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/exclusions:
    get:
      operationId: getSyncExclusions
      responses:
        "200":
          description: Effective Gitignore-style exclusion rules and current workspace candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncExclusions" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveSyncExclusions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncExclusionsRequest" }
      responses:
        "200":
          description: The validated shared .sshcignore document and updated candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncExclusions" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/push:
    get:
      operationId: getSyncPushDraft
      responses:
        "200":
          description: Message suggested from the local changes since the acknowledged snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushDraft" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    post:
      operationId: pushSnapshot
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Snapshot written because the local manifest changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sync/force-push:
    post:
      operationId: forcePushSnapshot
      # 現在のbinding世代・target digest・ETagへ結び付いた一度限りの確認が必要。
      # 実行lock内で同じbindingとtargetを再検証し、そのETagをIf-Matchに使う。
      parameters:
        - { name: X-SSHC-Action, in: header, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: The confirmed remote snapshot was replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
