  /api/v1/keys/{keyId}/public:
    get:
      operationId: readPublicKey
      description: >-
        Returns the text of one public key or certificate file. A public key is
        not a secret, so this needs no confirmation token and is not separated
        from the ordinary detail API the way reveal is. It refuses any entry
        that is not a public key or a certificate, so it can never be used to
        read private key material.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Public key text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKeyResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/connections:
    post:
      operationId: createConnection
      description: >-
        Creates one complete SSH Host entry. Password authentication stores its
        secret only in the encrypted vault and commits that vault change in the
        same journalled transaction as the configuration. Key authentication
        writes only an inventoried private-key reference. The response contains
        config diffs but never plaintext or encrypted vault bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectionRequest" }
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateConnectionResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateConnection
      description: >-
        Updates common settings for one existing SSH Host entry. Semantic
        setting changes are derived into config edits by the server. When a
        password assignment changes, the config and sealed vault are committed
        in one journalled transaction. The response contains configuration
        diffs but never plaintext or sealed vault bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectionRequest" }
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/config/groups/rename:
    post:
      operationId: renameGroup
      description: >-
        Renames a group directory and every reference to it: every
        connection file under connections/<old>, every key under keys/<old>,
        every IdentityFile pointing into it, the generated Include region, the
        compiled settings file and metadata.json. The changes use one journalled
        transaction. Nested groups travel with their parent. The emptied source
        directory is reported and is not removed: storage moves files, not
        directories.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRenameRequest" }
      responses:
        "200":
          description: Group renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/config/groups/delete:
    post:
      operationId: deleteGroup
      description: >-
        Removes a group's declaration and relocates its connections and keys
        into another group, or to the connections directory itself. No
        configuration file is ever deleted by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupDeleteRequest" }
      responses:
        "200":
          description: Group removed and its connections relocated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/location:
    post:
      operationId: relocateKey
      description: >-
        Changes a key's name, its group, or both, and rewrites every
        configuration directive that names it, in one transaction committed
        through the configuration engine so the rewritten files are re-parsed
        and re-resolved before anything lands. An absent field is left as it is;
        an empty group moves the key to the root of ~/.ssh. It refuses rather
        than guesses: a directive whose path cannot be resolved, one in a file
        outside the workspace, a destination an Include glob would read as
        configuration, or a group nothing declares each block the whole
        transaction and are reported as blockers.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelocateKeyRequest" }
      responses:
        "200":
          description: Key relocated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelocateKeyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: The relocation was blocked, and nothing was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelocateKeyResponse" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/agent:
    post:
      operationId: registerKeyWithAgent
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterKeyRequest" }
      responses:
        "200":
          description: Key registered with the ssh-agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterKeyResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    delete:
      # identity の削除に確認トークンは要らない。何も破壊しないし、最悪の場合でも
      # ユーザーがもう一度パスフレーズを尋ねられるだけである。
      operationId: deregisterKeyFromAgent
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Key removed from the ssh-agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentIdentitiesResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/keys/{keyId}/trash:
    post:
      operationId: trashKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Key moved to the trash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashKeyResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
